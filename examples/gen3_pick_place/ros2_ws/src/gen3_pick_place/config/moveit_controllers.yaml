# MoveIt trajectory-execution controller map, kept in sync with
# config/ros2_controllers.yaml: BOTH controllers are FollowJointTrajectory
# (the stock GripperCommand gen3_lite_2f_gripper_controller is replaced by
# a joint_trajectory_controller named gripper_controller).
moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
    - gripper_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    action_ns: follow_joint_trajectory
    default: true
  gripper_controller:
    type: FollowJointTrajectory
    joints:
      - right_finger_bottom_joint
    action_ns: follow_joint_trajectory
    default: true
