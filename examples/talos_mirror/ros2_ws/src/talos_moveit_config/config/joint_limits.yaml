# Velocity limits for every joint in the six planning groups, measured from
# the expanded URDF's own <limit velocity="..."/> values (talos_description's
# vendored hardware numbers, not a guess -- see docs/joint-inventory.md for
# the position half of the same measurement). MoveIt already reads position
# limits from the URDF directly; this file exists to carry the velocity
# figures into OMPL's time parameterization, same as
# talos_description/config/joint_limits.yaml does for its own (different,
# ros2_control-facing) purpose.
#
# Acceleration limits are NOT measured -- neither the URDF nor
# talos_description's own joint_limits.yaml specifies any (see that file's
# "Hands and legs keep the default values from URDF" comment, which for
# acceleration means "none"). Leaving has_acceleration_limits unset is not
# actually an option though: MoveIt's default post-planning adapter,
# AddTimeOptimalParameterization, hard-fails the whole plan with "No
# acceleration limit was defined for joint ..." if even one active joint in
# the group lacks one -- confirmed against this package's own move_group
# before this file had them (see README.md's verification log). So every
# joint below gets max_acceleration = max_velocity, a reach-full-speed-in-
# about-a-second convention (the same rule of thumb moveit_setup_assistant's
# generated configs commonly ship when a robot's URDF doesn't specify
# acceleration either), NOT a vendor-measured number. Anyone tuning real
# trajectory dynamics on this robot should replace these before trusting
# execution timing.
joint_limits:
  # torso
  torso_1_joint:
    has_velocity_limits: true
    max_velocity: 5.4
    has_acceleration_limits: true
    max_acceleration: 5.4
  torso_2_joint:
    has_velocity_limits: true
    max_velocity: 5.4
    has_acceleration_limits: true
    max_acceleration: 5.4

