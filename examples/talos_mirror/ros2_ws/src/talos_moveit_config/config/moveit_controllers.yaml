# Tells move_group's trajectory execution manager which action-server
# controller serves each planning group. Names and joint lists here must
# match config/ros2_controllers.yaml exactly -- MoveIt's simple controller
# manager looks the controller up by name, it does not discover it.
#
# Named literally "moveit_controllers.yaml" (not e.g. "talos_controllers")
# so MoveItConfigsBuilder.trajectory_execution()'s auto-detection picks it
# over config/ros2_controllers.yaml when both files match its
# `*_controllers.yaml` glob in this package's config/ directory: "moveit" is
# one of the names it prefers when more than one file matches.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - torso_controller
    - arm_l_controller
    - arm_r_controller
    - head_controller
    - leg_l_controller
    - leg_r_controller

  torso_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - torso_1_joint
      - torso_2_joint

  arm_l_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint

  arm_r_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint

  head_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - head_1_joint
      - head_2_joint

  leg_l_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - leg_left_1_joint
      - leg_left_2_joint
      - leg_left_3_joint
      - leg_left_4_joint
      - leg_left_5_joint
      - leg_left_6_joint

  leg_r_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - leg_right_1_joint
      - leg_right_2_joint
      - leg_right_3_joint
      - leg_right_4_joint
      - leg_right_5_joint
      - leg_right_6_joint
