<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM wall-weld simulation architecture</title>
  <desc id="desc">Gesture input triggers or aborts a simulated raster welding state machine with MoveIt collision checks and RViz feedback.</desc>
  <rect x="0" y="0" width="1280" height="840" fill="#F8FAFC"/>
  <text x="24" y="32" font-size="22" font-weight="700" fill="#0F172A">RoboLLM · Gesture-triggered wall-weld simulation</text>
  <text x="24" y="54" font-size="12" fill="#475569">C4 component view · marker-placed (or live-tracked) wall in the MoveIt scene · fist = weld the whole wall · palm = abort</text>

  <!-- Operator (person) -->
  <circle cx="115" cy="130" r="14" fill="#0F2742"/>
  <rect x="25" y="146" width="180" height="104" rx="6" fill="#0F2742"/>
  <text x="115" y="170" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Operator</text>
  <text x="115" y="189" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Person]</text>
  <text x="115" y="208" font-size="12" fill="#F8FAFC" text-anchor="middle">fist = weld · palm = abort;</text>
  <text x="115" y="223" font-size="12" fill="#F8FAFC" text-anchor="middle">phone shows the ArUco</text>
  <text x="115" y="238" font-size="12" fill="#F8FAFC" text-anchor="middle">marker that places the wall</text>

  <!-- Webcam (external) -->
  <rect x="25" y="330" width="180" height="95" rx="6" fill="#64748B"/>
  <text x="115" y="354" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Webcam</text>
  <text x="115" y="372" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[V4L2 · /dev/video0]</text>
  <text x="115" y="391" font-size="12" fill="#F8FAFC" text-anchor="middle">640x480 @ ~25 fps</text>
  <text x="115" y="406" font-size="12" fill="#F8FAFC" text-anchor="middle">gestures + marker</text>

  <!-- node boundary -->
  <rect x="250" y="90" width="770" height="562" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="264" y="112" font-size="12" font-style="italic" fill="#475569">wall_weld.py — one node [Python 3 · /opt/mpvenv · vision thread + 20 Hz control tick]</text>

  <!-- Row 1: vision components -->
  <rect x="280" y="130" width="225" height="105" rx="6" fill="#DBEAFE"/>
  <text x="392" y="154" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">ThreadedCapture</text>
  <text x="392" y="173" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[thread · cv2/V4L2]</text>
  <text x="392" y="192" font-size="12" fill="#0F172A" text-anchor="middle">latest-frame only; read</text>
  <text x="392" y="207" font-size="12" fill="#0F172A" text-anchor="middle">overlaps inference</text>

  <rect x="540" y="130" width="225" height="105" rx="6" fill="#DBEAFE"/>
  <text x="652" y="154" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">GestureRecognizer</text>
  <text x="652" y="173" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[MediaPipe 0.10.35 · VIDEO]</text>
  <text x="652" y="192" font-size="12" fill="#0F172A" text-anchor="middle">one call: Closed_Fist /</text>
  <text x="652" y="207" font-size="12" fill="#0F172A" text-anchor="middle">Open_Palm + 21 lm · ~27 ms</text>

  <rect x="800" y="130" width="210" height="105" rx="6" fill="#DBEAFE"/>
  <text x="905" y="154" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">GestureCtl</text>
  <text x="905" y="173" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[hysteresis SM]</text>
  <text x="905" y="192" font-size="12" fill="#0F172A" text-anchor="middle">fist x5 = START</text>
  <text x="905" y="207" font-size="12" fill="#0F172A" text-anchor="middle">palm x3 = ABORT</text>

  <!-- Row 2: aruco + wall manager -->
  <rect x="540" y="290" width="225" height="105" rx="6" fill="#DBEAFE"/>
  <text x="652" y="314" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">ArUco tracker</text>
  <text x="652" y="333" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[ArucoDetector · 4x4_50]</text>
  <text x="652" y="352" font-size="12" fill="#0F172A" text-anchor="middle">one-shot capture, or LIVE:</text>
  <text x="652" y="367" font-size="12" fill="#0F172A" text-anchor="middle">EMA-smoothed re-pose</text>
  <text x="652" y="382" font-size="12" fill="#0F172A" text-anchor="middle">while idle (wall_track)</text>

  <rect x="800" y="290" width="210" height="105" rx="6" fill="#DBEAFE"/>
  <text x="905" y="314" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">WallManager</text>
  <text x="905" y="333" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[scene ops · idle-hold]</text>
  <text x="905" y="352" font-size="12" fill="#0F172A" text-anchor="middle">box CollisionObject;</text>
  <text x="905" y="367" font-size="12" fill="#0F172A" text-anchor="middle">/wall_reset; atomic vs</text>
  <text x="905" y="382" font-size="12" fill="#0F172A" text-anchor="middle">the control tick</text>

  <!-- Row 3: planner + executor -->
  <rect x="280" y="470" width="225" height="105" rx="6" fill="#DBEAFE"/>
  <text x="392" y="494" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">RasterPlanner</text>
  <text x="392" y="513" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[serpentine · precheck]</text>
  <text x="392" y="532" font-size="12" fill="#0F172A" text-anchor="middle">11 rows · 15 mm standoff;</text>
  <text x="392" y="547" font-size="12" fill="#0F172A" text-anchor="middle">corner+grid IK check,</text>
  <text x="392" y="562" font-size="12" fill="#0F172A" text-anchor="middle">shrink-to-fit · lazy at fist</text>

  <rect x="540" y="470" width="225" height="105" rx="6" fill="#DBEAFE"/>
  <text x="652" y="494" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">WeldExecutor · 20 Hz</text>
  <text x="652" y="513" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[state machine + solve_track]</text>
  <text x="652" y="532" font-size="12" fill="#0F172A" text-anchor="middle">IDLE-APPROACH-WELD-</text>
  <text x="652" y="547" font-size="12" fill="#0F172A" text-anchor="middle">RETRACT; IK ~1.4 ms;</text>
  <text x="652" y="562" font-size="12" fill="#0F172A" text-anchor="middle">0.10 rad/tick clamp</text>

  <!-- External ROS 2 processes (right column) -->
  <rect x="1060" y="250" width="195" height="110" rx="6" fill="#0F6CBD"/>
  <text x="1157" y="274" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">move_group</text>
  <text x="1157" y="293" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[MoveIt 2]</text>
  <text x="1157" y="312" font-size="12" fill="#F8FAFC" text-anchor="middle">planning scene (wall);</text>
  <text x="1157" y="327" font-size="12" fill="#F8FAFC" text-anchor="middle">/check_state_validity</text>
  <text x="1157" y="342" font-size="12" fill="#F8FAFC" text-anchor="middle">(acceptance checks)</text>

  <rect x="1060" y="430" width="195" height="100" rx="6" fill="#0F6CBD"/>
  <text x="1157" y="454" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ros2_control</text>
  <text x="1157" y="473" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[mock hardware]</text>
  <text x="1157" y="492" font-size="12" fill="#F8FAFC" text-anchor="middle">arm JTC · joint_state</text>
  <text x="1157" y="507" font-size="12" fill="#F8FAFC" text-anchor="middle">broadcaster</text>

  <rect x="1060" y="570" width="195" height="110" rx="6" fill="#0F6CBD"/>
  <text x="1157" y="594" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">RViz</text>
  <text x="1157" y="613" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[wallweld.rviz]</text>
  <text x="1157" y="632" font-size="12" fill="#F8FAFC" text-anchor="middle">wall + growing bead +</text>
  <text x="1157" y="647" font-size="12" fill="#F8FAFC" text-anchor="middle">sparks; TF via</text>
  <text x="1157" y="662" font-size="12" fill="#F8FAFC" text-anchor="middle">robot_state_publisher</text>

  <!-- relationships -->
  <!-- operator -> webcam -->
  <line x1="115" y1="250" x2="115" y2="322" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="115,330 110,320 120,320" fill="#64748B"/>
  <text x="126" y="295" font-size="11" fill="#475569">fist · palm · marker</text>
  <!-- webcam -> capture -->
  <line x1="205" y1="370" x2="272" y2="200" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="276,192 266,196 274,203" fill="#64748B"/>
  <text x="196" y="270" font-size="11" fill="#475569">~25 fps</text>
  <!-- capture -> gesture -->
  <line x1="505" y1="182" x2="532" y2="182" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="540,182 530,177 530,187" fill="#64748B"/>
  <!-- gesture -> gesturectl -->
  <line x1="765" y1="182" x2="792" y2="182" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="800,182 790,177 790,187" fill="#64748B"/>
  <text x="768" y="170" font-size="11" fill="#475569">@ hand idx</text>
  <!-- capture -> aruco (raw frame) -->
  <line x1="392" y1="235" x2="392" y2="342" stroke="#64748B" stroke-width="1.5"/>
  <line x1="392" y1="342" x2="532" y2="342" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="540,342 530,337 530,347" fill="#64748B"/>
  <text x="398" y="330" font-size="11" fill="#475569">raw frame · idle only</text>
  <!-- aruco -> wallmanager -->
  <line x1="765" y1="342" x2="792" y2="342" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="800,342 790,337 790,347" fill="#64748B"/>
  <text x="712" y="410" font-size="11" fill="#475569">mapped pose · live &#8804;4 Hz</text>
  <!-- gesturectl -> executor (START/ABORT) -->
  <line x1="905" y1="235" x2="905" y2="262" stroke="#64748B" stroke-width="1.5"/>
  <line x1="905" y1="262" x2="770" y2="262" stroke="#64748B" stroke-width="1.5"/>
  <line x1="770" y1="262" x2="770" y2="462" stroke="#64748B" stroke-width="1.5"/>
  <line x1="770" y1="462" x2="700" y2="466" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="694,470 705,468 700,459" fill="#64748B"/>
  <text x="778" y="446" font-size="11" fill="#475569">START / ABORT</text>
  <!-- wallmanager -> planner (dashed: wall consumed lazily) -->
  <line x1="860" y1="395" x2="860" y2="428" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="860" y1="428" x2="392" y2="428" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="392" y1="428" x2="392" y2="462" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <polygon points="392,470 387,460 397,460" fill="#64748B"/>
  <text x="404" y="446" font-size="11" font-style="italic" fill="#475569">wall pose (plan lazily at fist)</text>
  <!-- wallmanager -> move_group -->
  <line x1="1010" y1="330" x2="1052" y2="312" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1060,309 1049,308 1053,317" fill="#64748B"/>
  <text x="1000" y="244" font-size="11" fill="#475569">/apply_planning_scene</text>
  <!-- planner -> executor -->
  <line x1="505" y1="522" x2="532" y2="522" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="540,522 530,517 530,527" fill="#64748B"/>
  <text x="496" y="510" font-size="11" fill="#475569">352 wp</text>
  <!-- executor -> ros2_control -->
  <line x1="765" y1="500" x2="1052" y2="482" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1060,481 1049,477 1050,487" fill="#64748B"/>
  <text x="790" y="482" font-size="11" fill="#475569">JointTrajectory · 20 Hz · 1 point</text>
  <!-- executor -> rviz markers -->
  <line x1="700" y1="575" x2="700" y2="620" stroke="#64748B" stroke-width="1.5"/>
  <line x1="700" y1="620" x2="1052" y2="620" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1060,620 1050,615 1050,625" fill="#64748B"/>
  <text x="726" y="608" font-size="11" fill="#475569">/wall_weld_markers · bead + sparks</text>
  <!-- ros2_control -> rviz -->
  <line x1="1157" y1="530" x2="1157" y2="562" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1157,570 1152,560 1162,560" fill="#64748B"/>
  <text x="1166" y="551" font-size="11" fill="#475569">/joint_states</text>
  <!-- operator watches note -->
  <text x="30" y="480" font-size="11" font-style="italic" fill="#475569">operator watches the weld in RViz</text>
  <text x="30" y="495" font-size="11" font-style="italic" fill="#475569">and aborts with a palm — the</text>
  <text x="30" y="510" font-size="11" font-style="italic" fill="#475569">human stays in the loop</text>

  <!-- legend -->
  <line x1="24" y1="722" x2="200" y2="722" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="748" font-size="13" font-weight="bold" fill="#0F172A">Legend</text>
  <rect x="24" y="762" width="18" height="14" rx="3" fill="#0F2742"/>
  <text x="50" y="773" font-size="12" fill="#0F172A">Person</text>
  <rect x="120" y="762" width="18" height="14" rx="3" fill="#DBEAFE"/>
  <text x="146" y="773" font-size="12" fill="#0F172A">Component (in-node)</text>
  <rect x="300" y="762" width="18" height="14" rx="3" fill="#0F6CBD"/>
  <text x="326" y="773" font-size="12" fill="#0F172A">Container (ROS 2 process)</text>
  <rect x="510" y="762" width="18" height="14" rx="3" fill="#64748B"/>
  <text x="536" y="773" font-size="12" fill="#0F172A">External device</text>
  <rect x="660" y="762" width="26" height="14" rx="3" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="694" y="773" font-size="12" fill="#0F172A">node boundary</text>
  <line x1="810" y1="769" x2="850" y2="769" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="858,769 848,764 848,774" fill="#64748B"/>
  <text x="866" y="773" font-size="12" fill="#0F172A">data flow</text>
  <line x1="950" y1="769" x2="990" y2="769" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <polygon points="998,769 988,764 988,774" fill="#64748B"/>
  <text x="1006" y="773" font-size="12" fill="#0F172A">lazy / on-demand</text>
  <text x="24" y="812" font-size="11" fill="#475569">C4 model (component view) · generated from wall_weld.py, wallweld.launch.py, wallweld.rviz, tools/wallweld_selftest.py, tools/wallweld_accept.py</text>
  <rect x="0" y="0" width="100%" height="6" fill="#38BDF8"/>
</svg>
