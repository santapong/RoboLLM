    <text x="770" y="766" font-size="12" font-weight="bold" fill="#333333">bold bottom line</text>
    <text x="878" y="766" font-size="12" fill="#333333">= lesson needs a simulator (launchers in sim/)</text>
  </g>
  <text x="24" y="800" font-size="11" fill="#777777">Concept map · generated from examples/ros2_py sources · self-testing lessons: 08, 09, 10 --test (print RESULT and exit 0/1) · run details in TECHNICAL.md</text>
