<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM browser dashboard architecture</title>
  <desc id="desc">The browser uses HTTP and WebSocket endpoints backed by FastAPI and the shared ROS 2 bridge with deadman and obstacle safety.</desc>
  <rect x="0" y="0" width="1280" height="840" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="24" y="38" font-size="22" font-weight="700" fill="#0F172A">RoboLLM · Browser dashboard architecture</text>
  <text x="24" y="58" font-size="12" fill="#475569">Browser teleop + telemetry on :8080; every motion command flows through robot_bridge's 0.6 s deadman + obstacle-safe teleop path (thick line)</text>

  <!-- Browser boundary -->
  <rect x="230" y="90" width="1020" height="185" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="246" y="112" font-size="12" font-style="italic" fill="#475569">Browser — web/static/index.html served by GET /  [vanilla JS single page · token auto-embedded]</text>

  <!-- Server boundary (label drawn after the arrows, see below) -->
  <rect x="230" y="330" width="1020" height="180" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- ============ Relationships ============ -->
  <!-- Operator -> teleop -->
  <line x1="185" y1="190" x2="240" y2="190" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="250,190 240,185 240,195" fill="#64748B"/>
  <rect x="176" y="166" width="84" height="14" fill="#F8FAFC"/>
  <text x="218" y="177" font-size="11" fill="#334155" text-anchor="middle">WASD · hold</text>

  <!-- A1 teleop -> control (SAFETY PATH, thick) -->
  <line x1="365" y1="255" x2="365" y2="365" stroke="#64748B" stroke-width="3"/>
  <polygon points="365,375 359,365 371,365" fill="#64748B"/>
  <rect x="291" y="291" width="148" height="14" fill="#F8FAFC"/>
  <text x="365" y="302" font-size="11" fill="#334155" text-anchor="middle">POST /api/cmd · /api/stop</text>
  <rect x="284" y="309" width="162" height="14" fill="#F8FAFC"/>
  <text x="365" y="320" font-size="11" fill="#334155" text-anchor="middle">150 ms loop &lt; 0.6 s deadman</text>

  <!-- A2 nav -> control -->
  <line x1="585" y1="255" x2="486" y2="367" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="482,375 480,364 490,367" fill="#64748B"/>
  <rect x="489" y="289" width="142" height="14" fill="#F8FAFC"/>
  <text x="560" y="300" font-size="11" fill="#334155" text-anchor="middle">POST /api/nav · /api/safe</text>

  <!-- A3 nav topics -> read -->
  <line x1="645" y1="255" x2="655" y2="365" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="656,375 650,366 661,364" fill="#64748B"/>
  <rect x="660" y="309" width="88" height="14" fill="#F8FAFC"/>
  <text x="704" y="320" font-size="11" fill="#334155" text-anchor="middle">GET /api/topics</text>

  <!-- A4 camera -> read -->
  <line x1="855" y1="255" x2="794" y2="367" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="790,375 788,364 798,367" fill="#64748B"/>
  <rect x="772" y="309" width="136" height="14" fill="#F8FAFC"/>
  <text x="840" y="320" font-size="11" fill="#334155" text-anchor="middle">GET /api/camera · 500 ms</text>

  <!-- A5 ws -> telemetry (upward) -->
  <line x1="1070" y1="375" x2="1093" y2="265" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1095,255 1089,264 1099,266" fill="#64748B"/>
  <rect x="1028" y="289" width="112" height="14" fill="#F8FAFC"/>
  <text x="1084" y="300" font-size="11" fill="#334155" text-anchor="middle">WS /ws · JSON 10 Hz</text>
  <rect x="1010" y="307" width="148" height="14" fill="#F8FAFC"/>
  <text x="1084" y="318" font-size="11" fill="#334155" text-anchor="middle">{pose, laser, radar, safe}</text>

  <!-- B1 control -> bridge (SAFETY PATH, thick) -->
  <line x1="390" y1="480" x2="558" y2="560" stroke="#64748B" stroke-width="3"/>
  <polygon points="567,565 555,564 560,555" fill="#64748B"/>
  <text x="352" y="520" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">set_velocity() · stop()</text>
  <text x="352" y="538" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">navigate_to() · safe flags</text>

  <!-- B2 read -> bridge -->
  <line x1="700" y1="480" x2="672" y2="557" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="670,565 666,554 677,557" fill="#64748B"/>
  <text x="775" y="520" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">camera_jpeg_bytes() ·</text>
  <text x="775" y="538" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">get_topic_names_and_types()</text>

  <!-- B3 ws -> bridge -->
  <line x1="1060" y1="480" x2="757" y2="563" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="750,565 758,557 761,567" fill="#64748B"/>
  <text x="1080" y="505" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">pose() · laser_summary() ·</text>
  <text x="1080" y="523" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">laser_radar(36)</text>

  <!-- C1 bridge -> ROS 2 (/cmd_vel, SAFETY PATH, thick) -->
  <line x1="490" y1="595" x2="235" y2="595" stroke="#64748B" stroke-width="3"/>
  <polygon points="225,595 235,589 235,601" fill="#64748B"/>
  <text x="357" y="585" font-size="11" fill="#334155" text-anchor="middle">/cmd_vel Twist — 20 Hz teleop tick</text>
  <text x="357" y="617" font-size="11" fill="#334155" text-anchor="middle">+ navigate_to_pose action goal</text>

  <!-- C2 ROS 2 -> bridge (sensor topics) -->
  <line x1="235" y1="645" x2="480" y2="645" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="490,645 480,640 480,650" fill="#64748B"/>
  <text x="357" y="665" font-size="11" fill="#334155" text-anchor="middle">/odom · /scan · /camera/image_raw</text>

  <!-- Server boundary label (over the arrows that cross it) -->
  <rect x="242" y="342" width="792" height="14" fill="#F8FAFC"/>
  <text x="246" y="352" font-size="12" font-style="italic" fill="#475569">web/server.py — FastAPI app on uvicorn :8080  [web/run-web.sh · HOST=127.0.0.1 default; LAN: HOST=0.0.0.0 + ROBOT_TOKEN=secret]</text>

  <!-- ============ Operator ============ -->
  <g>
    <rect x="25" y="140" width="160" height="95" rx="6" fill="#0F2742"/>
    <text x="105" y="164" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Operator</text>
    <text x="105" y="181" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[human · browser]</text>
    <text x="105" y="199" font-size="12" fill="#F8FAFC" text-anchor="middle">drives and monitors</text>
    <text x="105" y="214" font-size="12" fill="#F8FAFC" text-anchor="middle">the robot by hand</text>
  </g>

  <!-- ============ Browser components ============ -->
  <g>
    <rect x="250" y="150" width="230" height="105" rx="6" fill="#DBEAFE"/>
    <text x="365" y="174" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Teleop pad</text>
    <text x="365" y="193" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[hold-to-drive · WASD keys]</text>
    <text x="365" y="212" font-size="12" fill="#0F172A" text-anchor="middle">hold: POST /api/cmd each 150 ms</text>
    <text x="365" y="227" font-size="12" fill="#0F172A" text-anchor="middle">release / STOP: POST /api/stop</text>
    <text x="365" y="242" font-size="12" fill="#0F172A" text-anchor="middle">speed slider 0.05–0.8 m/s</text>
  </g>
  <g>
    <rect x="495" y="150" width="230" height="105" rx="6" fill="#DBEAFE"/>
    <text x="610" y="174" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Nav + safe + topics</text>
    <text x="610" y="193" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[form · toggle · list]</text>
    <text x="610" y="212" font-size="12" fill="#0F172A" text-anchor="middle">POST /api/nav {x, y, yaw_deg}</text>
    <text x="610" y="227" font-size="12" fill="#0F172A" text-anchor="middle">safe toggle: POST /api/safe</text>
    <text x="610" y="242" font-size="12" fill="#0F172A" text-anchor="middle">topic list: GET /api/topics</text>
  </g>
  <g>
    <rect x="740" y="150" width="230" height="105" rx="6" fill="#DBEAFE"/>
    <text x="855" y="174" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Camera panel</text>
    <text x="855" y="193" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[&lt;img&gt; poller]</text>
    <text x="855" y="212" font-size="12" fill="#0F172A" text-anchor="middle">GET /api/camera each 500 ms</text>
    <text x="855" y="227" font-size="12" fill="#0F172A" text-anchor="middle">shows latest JPEG frame;</text>
    <text x="855" y="242" font-size="12" fill="#0F172A" text-anchor="middle">204 = no camera (burger)</text>
  </g>
  <g>
    <rect x="985" y="150" width="245" height="105" rx="6" fill="#DBEAFE"/>
    <text x="1107" y="174" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Telemetry + lidar radar</text>
    <text x="1107" y="193" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[WS consumer · canvas radar]</text>
    <text x="1107" y="212" font-size="12" fill="#0F172A" text-anchor="middle">pose x/y/yaw°, vx, ωz; front/</text>
    <text x="1107" y="227" font-size="12" fill="#0F172A" text-anchor="middle">left/right/back ranges;</text>
    <text x="1107" y="242" font-size="12" fill="#0F172A" text-anchor="middle">36-sector radar to 3.5 m</text>
  </g>

  <!-- ============ Server components ============ -->
  <g>
    <rect x="250" y="375" width="280" height="105" rx="6" fill="#DBEAFE"/>
    <text x="390" y="399" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Control API (POST)</text>
    <text x="390" y="418" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[FastAPI · check(token) → 401]</text>
    <text x="390" y="437" font-size="12" fill="#0F172A" text-anchor="middle">/api/cmd {linear, angular}</text>
    <text x="390" y="452" font-size="12" fill="#0F172A" text-anchor="middle">/api/stop · /api/safe {enabled, min}</text>
    <text x="390" y="467" font-size="12" fill="#0F172A" text-anchor="middle">/api/nav {x, y, yaw_deg}</text>
  </g>
  <g>
    <rect x="560" y="375" width="300" height="105" rx="6" fill="#DBEAFE"/>
    <text x="710" y="399" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">Read API (GET)</text>
    <text x="710" y="418" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[FastAPI · no token required]</text>
    <text x="710" y="437" font-size="12" fill="#0F172A" text-anchor="middle">/ serves index.html + __TOKEN__</text>
    <text x="710" y="452" font-size="12" fill="#0F172A" text-anchor="middle">/api/topics · /api/camera (JPEG</text>
    <text x="710" y="467" font-size="12" fill="#0F172A" text-anchor="middle">or 204) · /static files</text>
  </g>
  <g>
    <rect x="890" y="375" width="340" height="105" rx="6" fill="#DBEAFE"/>
    <text x="1060" y="399" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">/ws telemetry stream</text>
    <text x="1060" y="418" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[WebSocket · async push loop]</text>
    <text x="1060" y="437" font-size="12" fill="#0F172A" text-anchor="middle">{pose, laser, radar(36), safe}</text>
    <text x="1060" y="452" font-size="12" fill="#0F172A" text-anchor="middle">JSON every 0.1 s (~10 Hz);</text>
    <text x="1060" y="467" font-size="12" fill="#0F172A" text-anchor="middle">client reconnects after 1 s</text>
  </g>

  <!-- ============ robot_bridge.py ============ -->
  <g>
    <rect x="490" y="565" width="310" height="120" rx="6" fill="#0F6CBD"/>
    <text x="645" y="589" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">robot_bridge.py</text>
    <text x="645" y="608" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python / rclpy · node claude_web_bridge]</text>
    <text x="645" y="627" font-size="12" fill="#F8FAFC" text-anchor="middle">get_bridge() shared-node singleton;</text>
    <text x="645" y="642" font-size="12" fill="#F8FAFC" text-anchor="middle">20 Hz teleop tick republishes cmd;</text>
    <text x="645" y="657" font-size="12" fill="#F8FAFC" text-anchor="middle">DEADMAN: auto-stop 0.6 s after last</text>
    <text x="645" y="672" font-size="12" fill="#F8FAFC" text-anchor="middle">cmd; safe_mode blocks fwd &lt; 0.35 m</text>
  </g>

  <!-- ============ ROS 2 graph ============ -->
  <g>
    <rect x="25" y="565" width="200" height="120" rx="6" fill="#64748B"/>
    <text x="125" y="589" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ROS 2 graph</text>
    <text x="125" y="608" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[topics · actions · DDS]</text>
    <text x="125" y="627" font-size="12" fill="#F8FAFC" text-anchor="middle">TurtleBot3 sim or real</text>
    <text x="125" y="642" font-size="12" fill="#F8FAFC" text-anchor="middle">robot; Nav2 action</text>
    <text x="125" y="657" font-size="12" fill="#F8FAFC" text-anchor="middle">server; the same graph</text>
    <text x="125" y="672" font-size="12" fill="#F8FAFC" text-anchor="middle">the MCP server drives</text>
  </g>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="712" x2="210" y2="712" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="736" font-size="12" font-weight="bold" fill="#0F172A">Legend</text>
  <g>
    <rect x="24" y="748" width="18" height="18" rx="3" fill="#0F2742"/>
    <text x="50" y="762" font-size="12" fill="#334155">Person / operator</text>

    <rect x="200" y="748" width="18" height="18" rx="3" fill="#0F6CBD"/>
    <text x="226" y="762" font-size="12" fill="#334155">Process / code in this repo</text>

    <rect x="420" y="748" width="18" height="18" rx="3" fill="#DBEAFE"/>
    <text x="446" y="762" font-size="12" fill="#334155">Component (in dashboard process)</text>

    <rect x="690" y="748" width="18" height="18" rx="3" fill="#64748B"/>
    <text x="716" y="762" font-size="12" fill="#334155">External system</text>

    <rect x="24" y="780" width="26" height="18" rx="3" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="58" y="794" font-size="12" fill="#334155">Execution boundary</text>

    <line x1="230" y1="789" x2="270" y2="789" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="280,789 270,784 270,794" fill="#64748B"/>
    <text x="290" y="794" font-size="12" fill="#334155">Relationship [protocol]</text>

    <line x1="470" y1="789" x2="510" y2="789" stroke="#64748B" stroke-width="3"/>
    <polygon points="520,789 510,784 510,794" fill="#64748B"/>
    <text x="530" y="794" font-size="12" fill="#334155">Deadman-teleop safety path (hold → /api/cmd → /cmd_vel)</text>
  </g>
  <text x="24" y="822" font-size="11" fill="#475569">C4 model (component view) · generated from repository sources: web/server.py, web/static/index.html, web/run-web.sh, robot_bridge.py</text>
  <rect x="0" y="0" width="100%" height="6" fill="#38BDF8"/>
</svg>
