<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="1040" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="24" y="38" font-size="18" font-weight="bold" fill="#000000">RoboLLM — scan3d: Phone/Webcam → 3D Mesh → URDF + 3D-Print STL</text>
  <text x="24" y="58" font-size="12" fill="#555555">Three capture-to-mesh routes — CPU visual hull (A), legacy sparse+GPU COLMAP (B), full-CPU Docker photogrammetry (C) with ChArUco metric scale — feeding two tails: URDF sim part and true-scale printable STL</text>

  <!-- Pipeline boundary -->
  <rect x="230" y="90" width="940" height="820" rx="6" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="246" y="112" font-size="12" font-style="italic" fill="#444444">scan3d pipeline — scan3d/ scripts + assets/ outputs  [assets/scan/ sessions are git-ignored]</text>

  <!-- ============ Relationships ============ -->
  <!-- Webcam -> capture.py -->
  <line x1="210" y1="172" x2="240" y2="172" stroke="#707070" stroke-width="1.5"/>
  <polygon points="250,172 240,167 240,177" fill="#707070"/>
  <!-- capture.py -> session images -->
  <line x1="510" y1="175" x2="580" y2="175" stroke="#707070" stroke-width="1.5"/>
  <polygon points="590,175 580,170 580,180" fill="#707070"/>
  <text x="548" y="163" font-size="11" fill="#333333" text-anchor="middle">JPG</text>
  <!-- Phone -> session images (ingest) -->
  <line x1="210" y1="300" x2="580" y2="222" stroke="#707070" stroke-width="1.5"/>
  <polygon points="590,220 580.7,226.9 578.6,217.1" fill="#707070"/>
  <rect x="300" y="255" width="180" height="14" fill="#FFFFFF"/>
  <text x="390" y="266" font-size="11" fill="#333333" text-anchor="middle">photos / video (ffmpeg 2 fps)</text>
  <!-- session -> Route A -->
  <line x1="620" y1="235" x2="420" y2="300" stroke="#707070" stroke-width="1.5"/>
  <polygon points="410,303 418,296.4 421.1,305.9" fill="#707070"/>
  <!-- session -> Route C -->
  <line x1="710" y1="235" x2="710" y2="290" stroke="#707070" stroke-width="1.5"/>
  <polygon points="710,300 705,290 715,290" fill="#707070"/>
  <text x="720" y="265" font-size="11" fill="#333333">40–80 orbit photos</text>
  <!-- session -> scale_mat.py -->
  <line x1="840" y1="200" x2="920" y2="290" stroke="#707070" stroke-width="1.5"/>
  <polygon points="927,297 917.5,293.2 925,286.6" fill="#707070"/>
  <!-- session -> Route B (legacy, left) -->
  <line x1="590" y1="225" x2="150" y2="430" stroke="#707070" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="141,434 148.5,426.9 152.7,436" fill="#707070"/>
  <!-- Route C -> scale_mat (sparse_txt) -->
  <line x1="840" y1="360" x2="900" y2="360" stroke="#707070" stroke-width="1.5"/>
  <polygon points="910,360 900,355 900,365" fill="#707070"/>
  <text x="872" y="348" font-size="11" fill="#333333" text-anchor="middle">sparse_txt/</text>
  <!-- Route A -> hull mesh -->
  <line x1="345" y1="430" x2="345" y2="480" stroke="#707070" stroke-width="1.5"/>
  <polygon points="345,490 340,480 350,480" fill="#707070"/>
  <text x="355" y="460" font-size="11" fill="#333333">marching cubes</text>
  <!-- Route C -> dense mesh -->
  <line x1="710" y1="430" x2="710" y2="480" stroke="#707070" stroke-width="1.5"/>
  <polygon points="710,490 705,480 715,480" fill="#707070"/>
  <text x="720" y="460" font-size="11" fill="#333333">textured .ply</text>
  <!-- scale_mat -> scale.json -->
  <line x1="1030" y1="430" x2="1030" y2="480" stroke="#707070" stroke-width="1.5"/>
  <polygon points="1030,490 1025,480 1035,480" fill="#707070"/>
  <!-- hull -> mesh_to_urdf -->
  <line x1="345" y1="585" x2="345" y2="640" stroke="#707070" stroke-width="1.5"/>
  <polygon points="345,650 340,640 350,640" fill="#707070"/>
  <!-- dense -> mesh_to_print -->
  <line x1="710" y1="585" x2="710" y2="640" stroke="#707070" stroke-width="1.5"/>
  <polygon points="710,650 705,640 715,640" fill="#707070"/>
  <!-- dense -> mesh_to_urdf (cross) -->
  <line x1="600" y1="580" x2="440" y2="645" stroke="#707070" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="431,649 438.8,642.2 442.6,651.5" fill="#707070"/>
  <!-- hull -> mesh_to_print (cross) -->
  <line x1="450" y1="580" x2="610" y2="645" stroke="#707070" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="619,649 608.9,651.4 612.6,642.1" fill="#707070"/>
  <!-- scale.json -> mesh_to_print -->
  <line x1="1000" y1="585" x2="850" y2="655" stroke="#707070" stroke-width="1.5"/>
  <polygon points="841,659 848.6,651.7 852.8,660.8" fill="#707070"/>
  <rect x="890" y="608" width="110" height="14" fill="#FFFFFF"/>
  <text x="945" y="619" font-size="11" fill="#333333" text-anchor="middle">mm_per_unit</text>
  <!-- mesh_to_urdf -> URDF part -->
  <line x1="345" y1="770" x2="345" y2="805" stroke="#707070" stroke-width="1.5"/>
  <polygon points="345,815 340,805 350,805" fill="#707070"/>
  <!-- mesh_to_print -> STL -->
  <line x1="710" y1="770" x2="710" y2="805" stroke="#707070" stroke-width="1.5"/>
  <polygon points="710,815 705,805 715,805" fill="#707070"/>
  <!-- URDF part -> sim consumers -->
  <line x1="470" y1="855" x2="950" y2="720" stroke="#707070" stroke-width="1.5"/>
  <polygon points="960,717 952.3,724.9 949.6,715.3" fill="#707070"/>
  <rect x="640" y="783" width="90" height="14" fill="#FFFFFF"/>
  <text x="685" y="794" font-size="11" fill="#333333" text-anchor="middle">p.loadURDF</text>
  <!-- STL -> slicer/CAD -->
  <line x1="840" y1="860" x2="950" y2="860" stroke="#707070" stroke-width="1.5"/>
  <polygon points="960,860 950,855 950,865" fill="#707070"/>

  <!-- ============ Externals (left) ============ -->
  <g>
    <rect x="30" y="125" width="180" height="95" rx="6" fill="#999999"/>
    <text x="120" y="149" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Webcam</text>
    <text x="120" y="166" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[V4L2 · /dev/videoN]</text>
    <text x="120" y="184" font-size="12" fill="#FFFFFF" text-anchor="middle">1280×720 frames;</text>
    <text x="120" y="199" font-size="12" fill="#FFFFFF" text-anchor="middle">object on turntable</text>
  </g>
  <g>
    <rect x="30" y="255" width="180" height="95" rx="6" fill="#999999"/>
    <text x="120" y="279" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Phone camera</text>
    <text x="120" y="296" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[photos or video]</text>
    <text x="120" y="314" font-size="12" fill="#FFFFFF" text-anchor="middle">orbit a STATIC object</text>
    <text x="120" y="329" font-size="12" fill="#FFFFFF" text-anchor="middle">on the ChArUco mat</text>
  </g>
  <g>
    <rect x="30" y="430" width="180" height="120" rx="6" fill="#999999"/>
    <text x="120" y="454" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Route B (legacy)</text>
    <text x="120" y="471" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[reconstruct.sh + GPU box]</text>
    <text x="120" y="489" font-size="12" fill="#FFFFFF" text-anchor="middle">sparse on CPU, dense</text>
    <text x="120" y="504" font-size="12" fill="#FFFFFF" text-anchor="middle">needs CUDA cloud;</text>
    <text x="120" y="519" font-size="12" fill="#FFFFFF" text-anchor="middle">superseded by Route C</text>
    <text x="120" y="534" font-size="12" fill="#FFFFFF" text-anchor="middle">for local use</text>
  </g>

  <!-- ============ Row 1: capture + session ============ -->
  <g>
    <rect x="250" y="120" width="260" height="110" rx="6" fill="#1168BD"/>
    <text x="380" y="144" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">capture.py</text>
    <text x="380" y="163" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / OpenCV · 1280×720]</text>
    <text x="380" y="182" font-size="12" fill="#FFFFFF" text-anchor="middle">--background empty-scene shot;</text>
    <text x="380" y="197" font-size="12" fill="#FFFFFF" text-anchor="middle">SPACE snapshots or --turntable</text>
    <text x="380" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle">N frames every 0.7 s</text>
  </g>
  <g>
    <rect x="590" y="120" width="260" height="110" rx="6" fill="#85BBF0"/>
    <text x="720" y="144" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">session images</text>
    <text x="720" y="163" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[assets/scan/&lt;session&gt;/images/]</text>
    <text x="720" y="182" font-size="12" fill="#000000" text-anchor="middle">webcam frames or phone shots;</text>
    <text x="720" y="197" font-size="12" fill="#000000" text-anchor="middle">ChArUco mat visible in most</text>
    <text x="720" y="212" font-size="12" fill="#000000" text-anchor="middle">frames for metric scale</text>
  </g>

  <!-- ============ Row 2: routes + scale solver ============ -->
  <g>
    <rect x="250" y="300" width="260" height="130" rx="6" fill="#1168BD"/>
    <text x="380" y="324" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">visual_hull.py</text>
    <text x="380" y="343" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Route A · Python · CPU]</text>
    <text x="380" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle">background-diff silhouettes</text>
    <text x="380" y="377" font-size="12" fill="#FFFFFF" text-anchor="middle">carve a voxel grid; fast</text>
    <text x="380" y="392" font-size="12" fill="#FFFFFF" text-anchor="middle">watertight solid, convex only</text>
    <text x="380" y="407" font-size="12" fill="#FFFFFF" text-anchor="middle">(a cup scans full)</text>
  </g>
  <g>
    <rect x="580" y="300" width="260" height="130" rx="6" fill="#1168BD"/>
    <text x="710" y="324" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">reconstruct_cpu.sh</text>
    <text x="710" y="343" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Route C · Docker · CPU-only]</text>
    <text x="710" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle">COLMAP sparse SfM → OpenMVS</text>
    <text x="710" y="377" font-size="12" fill="#FFFFFF" text-anchor="middle">densify + mesh + texture;</text>
    <text x="710" y="392" font-size="12" fill="#FFFFFF" text-anchor="middle">MESHER=poisson → Open3D</text>
    <text x="710" y="407" font-size="12" fill="#FFFFFF" text-anchor="middle">Screened Poisson (smoother)</text>
  </g>
  <g>
    <rect x="910" y="300" width="240" height="130" rx="6" fill="#1168BD"/>
    <text x="1030" y="324" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">scale_mat.py</text>
    <text x="1030" y="343" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / OpenCV aruco]</text>
    <text x="1030" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle">make: printable ChArUco mat;</text>
    <text x="1030" y="377" font-size="12" fill="#FFFFFF" text-anchor="middle">solve: triangulate corners via</text>
    <text x="1030" y="392" font-size="12" fill="#FFFFFF" text-anchor="middle">COLMAP poses → true</text>
    <text x="1030" y="407" font-size="12" fill="#FFFFFF" text-anchor="middle">mm-per-unit (0.006% self-test)</text>
  </g>

  <!-- ============ Row 3: artifacts ============ -->
  <g>
    <rect x="250" y="490" width="260" height="95" rx="6" fill="#85BBF0"/>
    <text x="380" y="514" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">&lt;session&gt;_hull.obj</text>
    <text x="380" y="533" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[watertight hull · metres]</text>
    <text x="380" y="552" font-size="12" fill="#000000" text-anchor="middle">quick CAD reference blank</text>
  </g>
  <g>
    <rect x="580" y="490" width="260" height="95" rx="6" fill="#85BBF0"/>
    <text x="710" y="514" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">&lt;session&gt;_photo.ply</text>
    <text x="710" y="533" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[dense textured mesh · scale-free]</text>
    <text x="710" y="552" font-size="12" fill="#000000" text-anchor="middle">+ scene_dense.ply point cloud</text>
  </g>
  <g>
    <rect x="910" y="490" width="240" height="95" rx="6" fill="#85BBF0"/>
    <text x="1030" y="514" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">scale.json</text>
    <text x="1030" y="533" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[scan3d.scale.v1]</text>
    <text x="1030" y="552" font-size="12" fill="#000000" text-anchor="middle">mm_per_unit + spread stats</text>
  </g>

  <!-- ============ Row 4: tails ============ -->
  <g>
    <rect x="220" y="650" width="250" height="120" rx="6" fill="#1168BD"/>
    <text x="345" y="674" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mesh_to_urdf.py</text>
    <text x="345" y="693" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / trimesh]</text>
    <text x="345" y="712" font-size="12" fill="#FFFFFF" text-anchor="middle">visual STL + convex-hull</text>
    <text x="345" y="727" font-size="12" fill="#FFFFFF" text-anchor="middle">collision STL + &lt;inertial&gt;</text>
    <text x="345" y="742" font-size="12" fill="#FFFFFF" text-anchor="middle">at --density kg/m³</text>
  </g>
  <g>
    <rect x="585" y="650" width="250" height="120" rx="6" fill="#1168BD"/>
    <text x="710" y="674" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">mesh_to_print.py</text>
    <text x="710" y="693" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / trimesh]</text>
    <text x="710" y="712" font-size="12" fill="#FFFFFF" text-anchor="middle">debris drop + hole fill (+ voxel</text>
    <text x="710" y="727" font-size="12" fill="#FFFFFF" text-anchor="middle">remesh fallback) → watertight,</text>
    <text x="710" y="742" font-size="12" fill="#FFFFFF" text-anchor="middle">true-mm, bed-oriented</text>
  </g>

  <!-- ============ Row 5: outputs + consumers ============ -->
  <g>
    <rect x="220" y="815" width="250" height="85" rx="6" fill="#85BBF0"/>
    <text x="345" y="839" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">URDF part</text>
    <text x="345" y="858" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[assets/urdf/&lt;name&gt;/]</text>
    <text x="345" y="877" font-size="12" fill="#000000" text-anchor="middle">.urdf + visual/collision STLs</text>
  </g>
  <g>
    <rect x="585" y="815" width="250" height="85" rx="6" fill="#85BBF0"/>
    <text x="710" y="839" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">&lt;name&gt;_print.stl</text>
    <text x="710" y="858" font-size="11" font-style="italic" fill="#000000" text-anchor="middle">[binary STL · millimetres]</text>
    <text x="710" y="877" font-size="12" fill="#000000" text-anchor="middle">dims/volume/PLA-grams report</text>
  </g>
  <g>
    <rect x="960" y="650" width="230" height="95" rx="6" fill="#999999"/>
    <text x="1075" y="674" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PyBullet / Gazebo</text>
    <text x="1075" y="691" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Jazzy · Harmonic]</text>
    <text x="1075" y="709" font-size="12" fill="#FFFFFF" text-anchor="middle">scanned part in a sim world</text>
    <text x="1075" y="724" font-size="12" fill="#FFFFFF" text-anchor="middle">(examples/pybullet loadURDF)</text>
  </g>
  <g>
    <rect x="960" y="815" width="230" height="95" rx="6" fill="#999999"/>
    <text x="1075" y="839" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Slicer / FreeCAD</text>
    <text x="1075" y="856" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[PrusaSlicer, Cura, FreeCAD]</text>
    <text x="1075" y="874" font-size="12" fill="#FFFFFF" text-anchor="middle">print it, or Part → Shape</text>
    <text x="1075" y="889" font-size="12" fill="#FFFFFF" text-anchor="middle">from mesh for CAD/CAM</text>
  </g>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="940" x2="210" y2="940" stroke="#DDDDDD" stroke-width="1"/>
  <text x="24" y="962" font-size="12" font-weight="bold" fill="#000000">Legend</text>
  <g>
    <rect x="24" y="976" width="18" height="18" rx="3" fill="#1168BD"/>
    <text x="50" y="990" font-size="12" fill="#333333">Pipeline script (this repo)</text>

    <rect x="240" y="976" width="18" height="18" rx="3" fill="#85BBF0"/>
    <text x="266" y="990" font-size="12" fill="#333333">Artifact on disk (assets/)</text>

    <rect x="460" y="976" width="18" height="18" rx="3" fill="#999999"/>
    <text x="486" y="990" font-size="12" fill="#333333">External device / system</text>

    <rect x="680" y="976" width="26" height="18" rx="3" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="714" y="990" font-size="12" fill="#333333">Pipeline boundary</text>

    <line x1="860" y1="985" x2="900" y2="985" stroke="#707070" stroke-width="1.5"/>
    <polygon points="910,985 900,980 900,990" fill="#707070"/>
    <text x="920" y="990" font-size="12" fill="#333333">Data flow (dashed = alternate)</text>
  </g>
  <text x="24" y="1026" font-size="11" fill="#777777">C4 model (component view) · generated from repository sources: scan3d/capture.py, visual_hull.py, reconstruct.sh, reconstruct_cpu.sh, scale_mat.py, poisson_mesh.py, mesh_to_urdf.py, mesh_to_print.py</text>
</svg>
