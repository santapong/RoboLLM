<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><rect x="0" y="0" width="297" height="210" fill="white" stroke="none" stroke-width="0.2" /><text x="12" y="12" fill="#171c22" font-family="Arial, sans-serif" font-size="5.291666666666666" font-weight="700">RoboLLM / Elexhub - tool and object markers</text><text x="12" y="23" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">Cut with a white border. Measure the black marker edge; store the marker-to-tool offset.</text><image x="35" y="60" width="20" height="20" href="data:image/png;base64," /><text x="70" y="67" fill="#171c22" font-family="Arial, sans-serif" font-size="4.2333333333333325" font-weight="700">Tool marker: ID 60 / black edge 20 mm</text><text x="70" y="79" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">Attach to a rigid, visible bracket. Recalibrate if it moves.</text><image x="37.5" y="110" width="15" height="15" href="data:image/png;base64," /><text x="70" y="114" fill="#171c22" font-family="Arial, sans-serif" font-size="4.2333333333333325" font-weight="700">Object marker: ID 70 / black edge 15 mm</text><text x="70" y="126" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">Optional marker-first box pose. Record its placement on the box.</text><text x="35" y="155" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">These IDs are distinct from the workspace and camera-calibration boards.</text><line x1="98.5" y1="185" x2="198.5" y2="185" stroke="#171c22" stroke-width="0.35" /><line x1="98.5" y1="186" x2="98.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="108.5" y1="186" x2="108.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="118.5" y1="186" x2="118.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="128.5" y1="186" x2="128.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="138.5" y1="186" x2="138.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="148.5" y1="186" x2="148.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="158.5" y1="186" x2="158.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="168.5" y1="186" x2="168.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="178.5" y1="186" x2="178.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="188.5" y1="186" x2="188.5" y2="184" stroke="#171c22" stroke-width="0.25" /><line x1="198.5" y1="186" x2="198.5" y2="184" stroke="#171c22" stroke-width="0.25" /><text x="130.5" y="182" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">100 mm - verify with a ruler</text></svg>