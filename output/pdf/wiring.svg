<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><rect x="0" y="0" width="297" height="210" fill="white" stroke="none" stroke-width="0.2" /><text x="12" y="13" fill="#171c22" font-family="Arial, sans-serif" font-size="5.644444444444444" font-weight="700">RoboLLM / Elexhub - wiring and power</text><text x="12" y="24" fill="#984210" font-family="Arial, sans-serif" font-size="3.175" font-weight="700">DESIGN PENDING COMPONENT RATINGS - complete the worksheet before connecting servo power.</text><rect x="12" y="46" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="15" y="55" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Raspberry Pi</text><text x="15" y="65" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">USB host</text><rect x="84" y="46" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="87" y="55" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Arduino Mega</text><text x="87" y="65" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Limits / watchdog</text><rect x="156" y="46" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="159" y="55" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">PCA9685</text><text x="159" y="65" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">PWM output</text><rect x="228" y="46" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="231" y="55" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Six servos</text><text x="231" y="65" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Five joints + gripper</text><line x1="69" y1="58" x2="84" y2="58" stroke="#245b88" stroke-width="0.4" /><text x="71" y="54" fill="#171c22" font-family="Arial, sans-serif" font-size="2.469444444444444" font-weight="400">USB</text><line x1="141" y1="58" x2="156" y2="58" stroke="#245b88" stroke-width="0.4" /><text x="143" y="54" fill="#171c22" font-family="Arial, sans-serif" font-size="2.469444444444444" font-weight="400">I2C</text><line x1="213" y1="58" x2="228" y2="58" stroke="#245b88" stroke-width="0.4" /><text x="215" y="54" fill="#171c22" font-family="Arial, sans-serif" font-size="2.469444444444444" font-weight="400">PWM</text><rect x="12" y="109" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="15" y="118" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Protected battery</text><text x="15" y="128" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Voltage / current: unset</text><rect x="84" y="109" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="87" y="118" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Fuse + cutoff</text><text x="87" y="128" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">DC rating: unset</text><rect x="156" y="109" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="159" y="118" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Regulator / BEC</text><text x="159" y="128" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Output V / A: unset</text><rect x="228" y="109" width="57" height="24" fill="#f3f5f6" stroke="#171c22" stroke-width="0.2" /><text x="231" y="118" fill="#171c22" font-family="Arial, sans-serif" font-size="3.880555555555555" font-weight="700">Power distribution</text><text x="231" y="128" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Rated wire; shared GND</text><line x1="69" y1="121" x2="84" y2="121" stroke="#a8392e" stroke-width="0.4" /><line x1="141" y1="121" x2="156" y2="121" stroke="#a8392e" stroke-width="0.4" /><line x1="213" y1="121" x2="228" y2="121" stroke="#a8392e" stroke-width="0.4" /><line x1="256.5" y1="109" x2="256.5" y2="70" stroke="#a8392e" stroke-width="0.4" /><text x="260" y="92" fill="#171c22" font-family="Arial, sans-serif" font-size="2.822222222222222" font-weight="400">Servo rail</text><text x="12" y="85" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">Mega D20 -&gt; SDA     D21 -&gt; SCL     5 V -&gt; VCC (logic only)     GND -&gt; GND</text><text x="12" y="96" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">Mega D22 -&gt; OE, with verified default-disable pull-up. All signal grounds share a reference.</text><text x="12" y="151" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">1. Never power servo motors from Mega/Pi 5 V. Check the breakout's terminal and trace ratings.</text><text x="12" y="162" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">2. OE disables PWM; it does not disconnect motor power. Use the physical DC-rated cutoff.</text><text x="12" y="173" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">3. Check regulator input range against the fully charged AND discharged battery voltages.</text><text x="12" y="184" fill="#171c22" font-family="Arial, sans-serif" font-size="3.5277777777777772" font-weight="400">4. Calibrate one unloaded servo at a time. Confirm polarity and signal pin labels on your actual board.</text><text x="12" y="201" fill="#171c22" font-family="Arial, sans-serif" font-size="2.469444444444444" font-weight="400">Sources: nxp.com/docs/en/data-sheet/PCA9685.pdf | learn.adafruit.com/16-channel-pwm-servo-driver/hooking-it-up</text></svg>