<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM · UR5e VLA sim bed topology</title>
  <desc id="desc">Route M, the primary bed: the Raspberry Pi hosts MuJoCo with the Menagerie UR5e scene, the mink expert, the LeRobot recorder, the mjviser viewer and a ZeroMQ lockstep server. The workstation runs the browser, the SmolVLA policy runner and evaluator, and stages datasets for a rented GPU behind a priced gate. External inputs are MuJoCo Menagerie and the Open X-Embodiment UR5 dataset in LeRobot format. Route O, optional, is an unmodified OmniSim build on the workstation. Every component is planned; nothing is verified yet.</desc>
  <rect x="0" y="0" width="1200" height="700" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1200" height="4" fill="#38BDF8"/>

  <text x="24" y="42" font-size="22" font-weight="700" fill="#0F172A">RoboLLM · UR5e VLA sim bed topology</text>
  <text x="24" y="63" font-size="12" fill="#475569">Route M: simulator on the always-on Pi, viewer and policy on the workstation, GPU rented only behind a priced gate. All boxes are Planned.</text>

  <!-- ============ Column headings ============ -->
  <text x="28" y="100" font-size="11" font-weight="700" fill="#475569">UPSTREAM INPUTS</text>
  <text x="300" y="100" font-size="11" font-weight="700" fill="#475569">RASPBERRY PI 5 · aarch64 · sim server</text>
  <text x="760" y="100" font-size="11" font-weight="700" fill="#475569">WORKSTATION · x86_64 · client</text>

  <!-- ============ Upstream inputs (external) ============ -->
  <rect x="28" y="130" width="220" height="70" rx="6" fill="#64748B"/>
  <text x="138" y="156" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">MuJoCo Menagerie</text>
  <text x="138" y="174" font-size="11" fill="#E2E8F0" text-anchor="middle">UR5e (BSD-3) + 2F-85 (BSD-2)</text>
  <text x="138" y="190" font-size="11" fill="#E2E8F0" text-anchor="middle">pinned commit, not vendored</text>

  <rect x="28" y="230" width="220" height="70" rx="6" fill="#64748B"/>
  <text x="138" y="256" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">lerobot/berkeley_autolab_ur5</text>
  <text x="138" y="274" font-size="11" fill="#E2E8F0" text-anchor="middle">Open X-Embodiment UR5, CC-BY-4.0</text>
  <text x="138" y="290" font-size="11" fill="#E2E8F0" text-anchor="middle">EE-delta actions, 5 fps</text>

  <rect x="28" y="330" width="220" height="70" rx="6" fill="#64748B"/>
  <text x="138" y="356" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">lerobot/smolvla_base</text>
  <text x="138" y="374" font-size="11" fill="#E2E8F0" text-anchor="middle">starting checkpoint (~450 M)</text>
  <text x="138" y="390" font-size="11" fill="#E2E8F0" text-anchor="middle">weights license: open item</text>

  <!-- ============ Pi container ============ -->
  <rect x="300" y="118" width="420" height="440" rx="10" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="316" y="140" font-size="11" fill="#475569">Python 3.13 venv · MUJOCO_GL=egl · nice · tailnet bind only</text>

  <rect x="316" y="156" width="388" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="332" y="180" font-size="13" font-weight="700" fill="#0F172A">MuJoCo 3.10.0 · scene/ur5e_red_target.xml</text>
  <text x="332" y="198" font-size="11" fill="#334155">overlay includes upstream ur5e.xml, attaches 2F-85, adds camera + red target</text>
  <text x="332" y="214" font-size="11" font-style="italic" fill="#475569">20 Hz control · 224×224 front camera · state[14] · action[7] EE deltas</text>

  <rect x="316" y="242" width="186" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="409" y="266" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">expert.py · mink IK</text>
  <text x="409" y="284" font-size="11" fill="#334155" text-anchor="middle">oracle + noisy, EE space</text>
  <text x="409" y="300" font-size="11" fill="#334155" text-anchor="middle">safety.py clamps every step</text>

  <rect x="518" y="242" width="186" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="611" y="266" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">record.py · LeRobot v3</text>
  <text x="611" y="284" font-size="11" fill="#334155" text-anchor="middle">v1 50 ep · v2 400/100 ep</text>
  <text x="611" y="300" font-size="11" fill="#334155" text-anchor="middle">B1 feature names, manifests</text>

  <rect x="316" y="328" width="186" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="409" y="352" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">viewer.py · mjviser</text>
  <text x="409" y="370" font-size="11" fill="#334155" text-anchor="middle">ViserMujocoScene, our loop</text>
  <text x="409" y="386" font-size="11" fill="#334155" text-anchor="middle">read-only during recording</text>

  <rect x="518" y="328" width="186" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="611" y="352" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">sim_server.py · ZeroMQ</text>
  <text x="611" y="370" font-size="11" fill="#334155" text-anchor="middle">REQ/REP lockstep: reset, step</text>
  <text x="611" y="386" font-size="11" fill="#334155" text-anchor="middle">steps physics only on request</text>

  <rect x="316" y="414" width="388" height="52" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="332" y="437" font-size="13" font-weight="700" fill="#0F172A">oxe_replay.py</text>
  <text x="332" y="455" font-size="11" fill="#334155">integrates real EE deltas, mink IK on the sim UR5e, side-by-side video (P3, kinematic only)</text>

  <text x="316" y="500" font-size="11" fill="#475569">Gate G0 (P0): non-black frame on the Pi, steps/s recorded, browser on the</text>
  <text x="316" y="516" font-size="11" fill="#475569">workstation shows the scene. Fallback: identical code on the workstation.</text>
  <text x="316" y="540" font-size="11" font-style="italic" fill="#475569">Datasets rsync to the workstation; nothing here needs real time.</text>

  <!-- ============ Workstation container ============ -->
  <rect x="760" y="118" width="412" height="440" rx="10" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="776" y="140" font-size="11" fill="#475569">Python 3.13 venv (NumPy 2, never the ROS venv) · no NVIDIA GPU</text>

  <rect x="776" y="156" width="380" height="60" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="792" y="180" font-size="13" font-weight="700" fill="#0F172A">Browser · http://&lt;pi-tailnet-ip&gt;:&lt;port&gt;</text>
  <text x="792" y="198" font-size="11" fill="#334155">mjviser web client: orbit, pause, reset (viewer-owned mode only)</text>

  <rect x="776" y="232" width="380" height="70" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="792" y="256" font-size="13" font-weight="700" fill="#0F172A">policy_runner.py + evaluate.py</text>
  <text x="792" y="274" font-size="11" fill="#334155">SmolVLA on CPU or a rented-GPU checkpoint; frozen suite with CIs</text>
  <text x="792" y="290" font-size="11" font-style="italic" fill="#475569">seconds per chunk measured, not assumed (P2)</text>

  <rect x="776" y="318" width="380" height="70" rx="6" fill="#D97706"/>
  <text x="792" y="342" font-size="13" font-weight="700" fill="#F8FAFC">GPU-GATE.md · rented 4090-class host</text>
  <text x="792" y="360" font-size="11" fill="#FEF3C7">smoke_train.sh first, then 20 k steps on v2 (+ optional OXE co-training)</text>
  <text x="792" y="376" font-size="11" font-style="italic" fill="#FDE68A">est. $8–16 · runs only on the user's go · checkpoint stays private</text>

  <rect x="776" y="404" width="380" height="62" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="792" y="428" font-size="13" font-weight="700" fill="#0F172A">Route O (optional) · OmniSim, unmodified, headless</text>
  <text x="792" y="446" font-size="11" fill="#334155">--stream=w3d viewer :1234 · harness :6789 loopback · x86 only</text>
  <text x="792" y="460" font-size="11" font-style="italic" fill="#475569">camera-headless gate first; ARM64 fix goes upstream, not here</text>

  <text x="776" y="500" font-size="11" fill="#475569">Cross-embodiment row (P5): same task, same simulator, B1 DIY arm vs UR5e.</text>
  <text x="776" y="516" font-size="11" fill="#475569">Cross-bed row: only if Route O passes its own gate.</text>

  <!-- ============ Arrows ============ -->
  <!-- Menagerie -> scene -->
  <line x1="248" y1="165" x2="306" y2="185" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="316,188 306,181 305,191" fill="#64748B"/>
  <!-- OXE -> replay -->
  <line x1="248" y1="265" x2="306" y2="436" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="316,440 305,436 308,428" fill="#64748B"/>
  <!-- smolvla_base -> policy runner / GPU gate -->
  <line x1="248" y1="365" x2="300" y2="600" stroke="#64748B" stroke-width="1.5"/>
  <line x1="300" y1="600" x2="766" y2="600" stroke="#64748B" stroke-width="1.5"/>
  <line x1="766" y1="600" x2="766" y2="360" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="776,354 768,364 764,354" fill="#64748B"/>
  <!-- viewer -> browser -->
  <line x1="502" y1="340" x2="766" y2="186" stroke="#0F6CBD" stroke-width="1.5"/>
  <polygon points="776,180 766,181 769,191" fill="#0F6CBD"/>
  <!-- sim server <-> policy runner -->
  <line x1="704" y1="362" x2="766" y2="270" stroke="#0F6CBD" stroke-width="1.5"/>
  <polygon points="776,262 764,264 771,272" fill="#0F6CBD"/>
  <polygon points="704,362 715,357 709,350" fill="#0F6CBD"/>
  <!-- recorder -> GPU gate (rsync) -->
  <line x1="704" y1="290" x2="766" y2="340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="776,346 765,345 769,336" fill="#64748B"/>

  <!-- ============ Legend ============ -->
  <rect x="28" y="590" width="14" height="14" rx="3" fill="#64748B"/>
  <text x="50" y="601" font-size="11" fill="#334155">external input, unmodified</text>
  <rect x="28" y="612" width="14" height="14" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="50" y="623" font-size="11" fill="#334155">planned component (this bed)</text>
  <rect x="28" y="634" width="14" height="14" rx="3" fill="#D97706"/>
  <text x="50" y="645" font-size="11" fill="#334155">gated: priced, runs only on the user's go</text>
  <line x1="28" y1="663" x2="42" y2="663" stroke="#0F6CBD" stroke-width="1.5"/>
  <text x="50" y="667" font-size="11" fill="#334155">tailnet link (viser websocket, ZeroMQ) · dashed grey: rsync of datasets</text>
  <text x="600" y="690" font-size="10" fill="#94A3B8" text-anchor="middle">Specification: sim/vla-bed/SDD.md · Attribution: NOTICES.md · Citations: REFERENCES.md · Palette per docs/STYLE_GUIDE.md</text>
</svg>
