<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="840" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="24" y="38" font-size="18" font-weight="bold" fill="#000000">RoboLLM — Hardware Architecture: Real Arm Stack (Pi 5 + Uno R3)</text>
  <text x="24" y="58" font-size="12" fill="#555555">Host plans in ROS 2 and streams targets over a text serial protocol; the Uno slew-limits servos; sim_uno.py is the drop-in no-hardware substitute</text>

  <!-- Host boundary -->
  <rect x="250" y="90" width="580" height="610" rx="6" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="266" y="112" font-size="12" font-style="italic" fill="#444444">hardware/ — host side  [Python 3 · ROS 2 Jazzy · laptop or Raspberry Pi 5]</text>

  <!-- Uno boundary -->
  <rect x="880" y="250" width="310" height="240" rx="6" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="896" y="272" font-size="12" font-style="italic" fill="#444444">Arduino Uno R3  [ATmega328P · 2 KB RAM]</text>

  <!-- ============ Relationships ============ -->
  <!-- ROS 2 graph -> arm_bridge_node (/arm/command) -->
  <line x1="175" y1="170" x2="260" y2="170" stroke="#707070" stroke-width="1.5"/>
  <polygon points="270,170 260,165 260,175" fill="#707070"/>
  <rect x="184" y="149" width="92" height="14" fill="#FFFFFF"/>
  <text x="230" y="160" font-size="11" fill="#333333" text-anchor="middle">/arm/command</text>

  <!-- arm_bridge_node -> ROS 2 graph (/arm/joint_states) -->
  <line x1="270" y1="205" x2="185" y2="205" stroke="#707070" stroke-width="1.5"/>
  <polygon points="175,205 185,200 185,210" fill="#707070"/>
  <rect x="176" y="212" width="104" height="14" fill="#FFFFFF"/>
  <text x="228" y="223" font-size="11" fill="#333333" text-anchor="middle">/arm/joint_states</text>

  <!-- arm_bridge_node -> arm_serial -->
  <line x1="397" y1="235" x2="397" y2="290" stroke="#707070" stroke-width="1.5"/>
  <polygon points="397,300 392,290 402,290" fill="#707070"/>
  <text x="407" y="260" font-size="11" font-style="italic" fill="#333333">ArmSerial: set_joint(),</text>
  <text x="407" y="274" font-size="11" font-style="italic" fill="#333333">get_joints(), enable()</text>

  <!-- arm_serial -> firmware (USB serial) -->
  <line x1="525" y1="352" x2="895" y2="352" stroke="#707070" stroke-width="1.5"/>
  <polygon points="905,352 895,347 895,357" fill="#707070"/>
  <text x="715" y="340" font-size="11" fill="#333333" text-anchor="middle">USB serial · 115200 · one text line per command</text>
  <text x="715" y="368" font-size="11" fill="#333333" text-anchor="middle">PING · E 1|0 · S &lt;ch&gt; &lt;deg&gt; · G · LED 1|0</text>
  <text x="715" y="384" font-size="11" font-style="italic" fill="#333333" text-anchor="middle">(open resets the Uno: DTR → ~2.5 s wait)</text>

  <!-- arm_serial -> sim_uno (alternative endpoint) -->
  <line x1="397" y1="405" x2="397" y2="460" stroke="#707070" stroke-width="1.5"/>
  <polygon points="397,470 392,460 402,460" fill="#707070"/>
  <text x="407" y="430" font-size="11" fill="#333333">same protocol · pty</text>
  <text x="407" y="444" font-size="11" fill="#333333">ARM_PORT=/dev/pts/N</text>

  <!-- firmware -> servos (PWM) -->
  <line x1="1035" y1="440" x2="1035" y2="550" stroke="#707070" stroke-width="1.5"/>
  <polygon points="1035,560 1030,550 1040,550" fill="#707070"/>
  <text x="1045" y="510" font-size="11" fill="#333333">50 Hz PWM</text>
  <text x="1045" y="524" font-size="11" fill="#333333">pins 3 5 6 9 10 11</text>

  <!-- check_arduino.sh -> Uno -->
  <line x1="800" y1="471" x2="869" y2="437" stroke="#707070" stroke-width="1.5"/>
  <polygon points="878,432 870.9,440.1 867.3,432.9" fill="#707070"/>
  <text x="838" y="430" font-size="11" fill="#333333" text-anchor="middle">flash + PING</text>

  <!-- ============ External: ROS 2 graph ============ -->
  <g>
    <rect x="25" y="130" width="150" height="110" rx="6" fill="#999999"/>
    <text x="100" y="154" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ROS 2 graph</text>
    <text x="100" y="171" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[topics · DDS]</text>
    <text x="100" y="190" font-size="12" fill="#FFFFFF" text-anchor="middle">planners, MCP</text>
    <text x="100" y="205" font-size="12" fill="#FFFFFF" text-anchor="middle">bridge, teleop on</text>
    <text x="100" y="220" font-size="12" fill="#FFFFFF" text-anchor="middle">the same LAN</text>
  </g>

  <!-- ============ Host-side processes ============ -->
  <!-- arm_bridge_node.py -->
  <g>
    <rect x="270" y="130" width="255" height="105" rx="6" fill="#1168BD"/>
    <text x="397" y="154" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">arm_bridge_node.py</text>
    <text x="397" y="173" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / rclpy · node arm_bridge]</text>
    <text x="397" y="192" font-size="12" fill="#FFFFFF" text-anchor="middle">subscribes /arm/command (deg),</text>
    <text x="397" y="207" font-size="12" fill="#FFFFFF" text-anchor="middle">publishes /arm/joint_states</text>
    <text x="397" y="222" font-size="12" fill="#FFFFFF" text-anchor="middle">at 10 Hz (radians)</text>
  </g>

  <!-- arm_serial.py -->
  <g>
    <rect x="270" y="300" width="255" height="105" rx="6" fill="#1168BD"/>
    <text x="397" y="324" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">arm_serial.py</text>
    <text x="397" y="343" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / pyserial · driver + CLI]</text>
    <text x="397" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle">auto-detects the Uno's USB port</text>
    <text x="397" y="377" font-size="12" fill="#FFFFFF" text-anchor="middle">(ARM_PORT env overrides); CLI:</text>
    <text x="397" y="392" font-size="12" fill="#FFFFFF" text-anchor="middle">ping · joints · set · led</text>
  </g>

  <!-- sim_uno.py -->
  <g>
    <rect x="270" y="470" width="255" height="105" rx="6" fill="#1168BD"/>
    <text x="397" y="494" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">sim_uno.py</text>
    <text x="397" y="513" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python / pty · fake Uno]</text>
    <text x="397" y="532" font-size="12" fill="#FFFFFF" text-anchor="middle">emulates the firmware protocol</text>
    <text x="397" y="547" font-size="12" fill="#FFFFFF" text-anchor="middle">incl. 100 deg/s slew limit —</text>
    <text x="397" y="562" font-size="12" fill="#FFFFFF" text-anchor="middle">develop with no hardware</text>
  </g>

  <!-- check_arduino.sh -->
  <g>
    <rect x="545" y="440" width="255" height="100" rx="6" fill="#1168BD"/>
    <text x="672" y="464" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">check_arduino.sh</text>
    <text x="672" y="483" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[bash · 6-step health check]</text>
    <text x="672" y="502" font-size="12" fill="#FFFFFF" text-anchor="middle">toolchain → port → perms →</text>
    <text x="672" y="517" font-size="12" fill="#FFFFFF" text-anchor="middle">compile → flash → PING</text>
  </g>

  <!-- pi5_setup.sh -->
  <g>
    <rect x="545" y="565" width="255" height="100" rx="6" fill="#1168BD"/>
    <text x="672" y="589" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">pi5_setup.sh</text>
    <text x="672" y="608" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[bash · run once on the Pi 5]</text>
    <text x="672" y="627" font-size="12" fill="#FFFFFF" text-anchor="middle">dialout, arduino-cli, ROS 2</text>
    <text x="672" y="642" font-size="12" fill="#FFFFFF" text-anchor="middle">Jazzy, /dev/arm_uno udev rule</text>
  </g>

  <!-- ============ Firmware on the Uno ============ -->
  <g>
    <rect x="905" y="300" width="260" height="140" rx="6" fill="#1168BD"/>
    <text x="1035" y="324" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">arm_firmware.ino</text>
    <text x="1035" y="343" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[C++ / Servo lib · 115200 baud]</text>
    <text x="1035" y="362" font-size="12" fill="#FFFFFF" text-anchor="middle">line protocol → servo targets;</text>
    <text x="1035" y="377" font-size="12" fill="#FFFFFF" text-anchor="middle">slew limit 2°/20 ms (100 deg/s);</text>
    <text x="1035" y="392" font-size="12" fill="#FFFFFF" text-anchor="middle">MIN/MAX_DEG per-joint clamps;</text>
    <text x="1035" y="407" font-size="12" fill="#FFFFFF" text-anchor="middle">2 KB RAM — no micro-ROS,</text>
    <text x="1035" y="422" font-size="12" fill="#FFFFFF" text-anchor="middle">text serial is intentional</text>
  </g>

  <!-- ============ External: servos ============ -->
  <g>
    <rect x="905" y="560" width="260" height="120" rx="6" fill="#999999"/>
    <text x="1035" y="584" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Arm servos (up to 6)</text>
    <text x="1035" y="603" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[hobby PWM servos · ch 0–5]</text>
    <text x="1035" y="622" font-size="12" fill="#FFFFFF" text-anchor="middle">power from EXTERNAL 5–6 V</text>
    <text x="1035" y="637" font-size="12" fill="#FFFFFF" text-anchor="middle">supply, common GND — never</text>
    <text x="1035" y="652" font-size="12" fill="#FFFFFF" text-anchor="middle">the Uno's 5V pin</text>
  </g>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="722" x2="210" y2="722" stroke="#DDDDDD" stroke-width="1"/>
  <text x="24" y="748" font-size="12" font-weight="bold" fill="#000000">Legend</text>
  <g>
    <rect x="24" y="762" width="18" height="18" rx="3" fill="#1168BD"/>
    <text x="50" y="776" font-size="12" fill="#333333">Process / code in this repo</text>

    <rect x="250" y="762" width="18" height="18" rx="3" fill="#999999"/>
    <text x="276" y="776" font-size="12" fill="#333333">External system / device</text>

    <rect x="470" y="762" width="26" height="18" rx="3" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="504" y="776" font-size="12" fill="#333333">Execution boundary (host / board)</text>

    <line x1="740" y1="771" x2="780" y2="771" stroke="#707070" stroke-width="1.5"/>
    <polygon points="790,771 780,766 780,776" fill="#707070"/>
    <text x="800" y="776" font-size="12" fill="#333333">Relationship [protocol]</text>
  </g>
  <text x="24" y="812" font-size="11" fill="#777777">C4 model (component view) · generated from repository sources: hardware/arm_bridge_node.py, arm_serial.py, sim_uno.py, check_arduino.sh, pi5_setup.sh, firmware/arm_firmware/</text>
</svg>
