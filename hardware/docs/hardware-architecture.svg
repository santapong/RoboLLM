<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM physical-arm hardware architecture</title>
  <desc id="desc">ROS 2 validates trajectories, the host converts logical radians to raw degrees, and Arduino firmware enforces hard safety limits.</desc>
  <rect x="0" y="0" width="1280" height="840" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="24" y="38" font-size="22" font-weight="700" fill="#0F172A">RoboLLM · Physical-arm hardware architecture</text>
  <text x="24" y="58" font-size="12" fill="#475569">ROS 2 validates named trajectories; the Mega enforces generated limits and a watchdog; sim_uno.py is the no-hardware substitute</text>

  <!-- Host boundary -->
  <rect x="250" y="90" width="580" height="610" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="266" y="112" font-size="12" font-style="italic" fill="#475569">ros2/robo_arm_driver + hardware/  [ROS 2 Jazzy · laptop or Raspberry Pi 5]</text>

  <!-- Mega boundary -->
  <rect x="880" y="250" width="310" height="240" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="896" y="272" font-size="12" font-style="italic" fill="#475569">Arduino Mega 2560  [ATmega2560 · 8 KB RAM]</text>

  <!-- ============ Relationships ============ -->
  <!-- ROS 2 graph -> driver (JointTrajectory) -->
  <line x1="175" y1="170" x2="260" y2="170" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="270,170 260,165 260,175" fill="#64748B"/>
  <rect x="184" y="149" width="92" height="14" fill="#F8FAFC"/>
  <text x="230" y="160" font-size="10" fill="#334155" text-anchor="middle">JointTrajectory</text>

  <!-- driver -> ROS 2 graph (/joint_states) -->
  <line x1="270" y1="205" x2="185" y2="205" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="175,205 185,200 185,210" fill="#64748B"/>
  <rect x="176" y="212" width="104" height="14" fill="#F8FAFC"/>
  <text x="228" y="223" font-size="11" fill="#334155" text-anchor="middle">/joint_states</text>

  <!-- robo_arm_driver -> arm_serial -->
  <line x1="397" y1="235" x2="397" y2="290" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="397,300 392,290 402,290" fill="#64748B"/>
  <text x="407" y="260" font-size="11" font-style="italic" fill="#334155">validated radians →</text>
  <text x="407" y="274" font-size="11" font-style="italic" fill="#334155">calibrated raw degrees</text>

  <!-- arm_serial -> firmware (USB serial) -->
  <line x1="525" y1="352" x2="895" y2="352" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="905,352 895,347 895,357" fill="#64748B"/>
  <text x="715" y="340" font-size="11" fill="#334155" text-anchor="middle">USB serial · 115200 · one text line per command</text>
  <text x="715" y="368" font-size="11" fill="#334155" text-anchor="middle">S · Q · H · E · X · commissioning-only C · P · L</text>
  <text x="715" y="384" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">(open resets the Mega: DTR → ~2.5 s wait)</text>

  <!-- arm_serial -> sim_uno (alternative endpoint) -->
  <line x1="397" y1="405" x2="397" y2="460" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="397,470 392,460 402,460" fill="#64748B"/>
  <text x="407" y="430" font-size="11" fill="#334155">same protocol · pty</text>
  <text x="407" y="444" font-size="11" fill="#334155">ARM_PORT=/dev/pts/N</text>

  <!-- firmware -> servos (PWM) -->
  <line x1="1035" y1="440" x2="1035" y2="550" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="1035,560 1030,550 1040,550" fill="#64748B"/>
  <text x="1045" y="510" font-size="11" fill="#334155">50 Hz PWM</text>
  <text x="1045" y="524" font-size="11" fill="#334155">pins 3 5 6 9 10 11</text>

  <!-- check_arduino.sh -> Mega -->
  <line x1="800" y1="471" x2="869" y2="437" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="878,432 870.9,440.1 867.3,432.9" fill="#64748B"/>
  <text x="838" y="430" font-size="11" fill="#334155" text-anchor="middle">flash + PING</text>

  <!-- ============ External: ROS 2 graph ============ -->
  <g>
    <rect x="25" y="130" width="150" height="110" rx="6" fill="#64748B"/>
    <text x="100" y="154" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ROS 2 graph</text>
    <text x="100" y="171" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[topics · DDS]</text>
    <text x="100" y="190" font-size="12" fill="#F8FAFC" text-anchor="middle">planners, MCP</text>
    <text x="100" y="205" font-size="12" fill="#F8FAFC" text-anchor="middle">bridge, teleop on</text>
    <text x="100" y="220" font-size="12" fill="#F8FAFC" text-anchor="middle">the same LAN</text>
  </g>

  <!-- ============ Host-side processes ============ -->
  <!-- robo_arm_driver package -->
  <g>
    <rect x="270" y="130" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="397" y="154" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">robo_arm_driver</text>
    <text x="397" y="173" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python / rclpy · installable package]</text>
    <text x="397" y="192" font-size="12" fill="#F8FAFC" text-anchor="middle">names · limits · time · velocity,</text>
    <text x="397" y="207" font-size="12" fill="#F8FAFC" text-anchor="middle">trajectory sampling + /joint_states</text>
    <text x="397" y="222" font-size="12" fill="#F8FAFC" text-anchor="middle">honest commanded/measured provenance</text>
  </g>

  <!-- arm_serial.py -->
  <g>
    <rect x="270" y="300" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="397" y="324" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">arm_serial.py</text>
    <text x="397" y="343" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python / pyserial · driver + CLI]</text>
    <text x="397" y="362" font-size="12" fill="#F8FAFC" text-anchor="middle">auto-detects the Mega's USB port</text>
    <text x="397" y="377" font-size="12" fill="#F8FAFC" text-anchor="middle">(ARM_PORT env overrides); CLI:</text>
    <text x="397" y="392" font-size="12" fill="#F8FAFC" text-anchor="middle">ping · state · commission · relax · led</text>
  </g>

  <!-- sim_uno.py -->
  <g>
    <rect x="270" y="470" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="397" y="494" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">sim_uno.py</text>
    <text x="397" y="513" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python / pty · protocol simulator]</text>
    <text x="397" y="532" font-size="12" fill="#F8FAFC" text-anchor="middle">emulates the firmware protocol</text>
    <text x="397" y="547" font-size="12" fill="#F8FAFC" text-anchor="middle">same YAML limits + watchdog —</text>
    <text x="397" y="562" font-size="12" fill="#F8FAFC" text-anchor="middle">develop with no hardware</text>
  </g>

  <!-- check_arduino.sh -->
  <g>
    <rect x="545" y="440" width="255" height="100" rx="6" fill="#0F6CBD"/>
    <text x="672" y="464" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">check_arduino.sh</text>
    <text x="672" y="483" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[bash · 6-step health check]</text>
    <text x="672" y="502" font-size="12" fill="#F8FAFC" text-anchor="middle">toolchain → port → perms →</text>
    <text x="672" y="517" font-size="12" fill="#F8FAFC" text-anchor="middle">compile → flash → PING</text>
  </g>

  <!-- pi5_setup.sh -->
  <g>
    <rect x="545" y="565" width="255" height="100" rx="6" fill="#0F6CBD"/>
    <text x="672" y="589" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">pi5_setup.sh</text>
    <text x="672" y="608" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[bash · run once on the Pi 5]</text>
    <text x="672" y="627" font-size="12" fill="#F8FAFC" text-anchor="middle">dialout, arduino-cli, ROS 2</text>
    <text x="672" y="642" font-size="12" fill="#F8FAFC" text-anchor="middle">Jazzy, /dev/arm_controller udev rule</text>
  </g>

  <!-- ============ Firmware on the Mega ============ -->
  <g>
    <rect x="905" y="300" width="260" height="140" rx="6" fill="#0F6CBD"/>
    <text x="1035" y="324" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">arm_firmware.ino</text>
    <text x="1035" y="343" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[C++ / Servo lib · 115200 baud]</text>
    <text x="1035" y="362" font-size="12" fill="#F8FAFC" text-anchor="middle">line protocol → servo targets;</text>
    <text x="1035" y="377" font-size="12" fill="#F8FAFC" text-anchor="middle">generated per-joint limits + slew;</text>
    <text x="1035" y="392" font-size="12" fill="#F8FAFC" text-anchor="middle">commissioning lock + 750 ms timeout;</text>
    <text x="1035" y="407" font-size="12" fill="#F8FAFC" text-anchor="middle">rejects invalid commands; 2 KB RAM,</text>
    <text x="1035" y="422" font-size="12" fill="#F8FAFC" text-anchor="middle">so text serial is intentional</text>
  </g>

  <!-- ============ External: servos ============ -->
  <g>
    <rect x="905" y="560" width="260" height="120" rx="6" fill="#64748B"/>
    <text x="1035" y="584" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">6 joints + gripper servo</text>
    <text x="1035" y="603" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[hobby PWM servos · calibrated limits]</text>
    <text x="1035" y="622" font-size="12" fill="#F8FAFC" text-anchor="middle">power from EXTERNAL 5–6 V</text>
    <text x="1035" y="637" font-size="12" fill="#F8FAFC" text-anchor="middle">supply, common GND — never</text>
    <text x="1035" y="652" font-size="12" fill="#F8FAFC" text-anchor="middle">the Mega's 5V pin</text>
  </g>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="722" x2="210" y2="722" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="748" font-size="12" font-weight="bold" fill="#0F172A">Legend</text>
  <g>
    <rect x="24" y="762" width="18" height="18" rx="3" fill="#0F6CBD"/>
    <text x="50" y="776" font-size="12" fill="#334155">Process / code in this repo</text>

    <rect x="250" y="762" width="18" height="18" rx="3" fill="#64748B"/>
    <text x="276" y="776" font-size="12" fill="#334155">External system / device</text>

    <rect x="470" y="762" width="26" height="18" rx="3" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="504" y="776" font-size="12" fill="#334155">Execution boundary (host / board)</text>

    <line x1="740" y1="771" x2="780" y2="771" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="790,771 780,766 780,776" fill="#64748B"/>
    <text x="800" y="776" font-size="12" fill="#334155">Relationship [protocol]</text>
  </g>
  <text x="24" y="812" font-size="11" fill="#475569">C4 component view · sources: ros2/robo_arm_driver, hardware/sim_uno.py, check_arduino.sh, pi5_setup.sh, firmware/arm_firmware/</text>
  <rect x="0" y="0" width="100%" height="6" fill="#38BDF8"/>
</svg>
