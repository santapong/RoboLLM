<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM CAD to URDF architecture</title>
  <desc id="desc">FreeCAD creates parametric meshes, Python assembles an inertial URDF, and PyBullet verifies articulation.</desc>
  <rect x="0" y="0" width="1280" height="840" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="24" y="38" font-size="22" font-weight="700" fill="#0F172A">RoboLLM · CAD → URDF → simulation</text>
  <text x="24" y="58" font-size="12" fill="#475569">Parametric parts built headless with freecadcmd become an articulated 2-link arm URDF with real mass/inertia, verified end to end in PyBullet</text>

  <!-- freecadcmd boundary -->
  <rect x="45" y="95" width="320" height="235" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="61" y="117" font-size="12" font-style="italic" fill="#475569">freecadcmd — FreeCAD headless  [no display]</text>
  <text x="202" y="277" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">run: freecadcmd cad/build_two_link_arm.py</text>
  <text x="202" y="294" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">(or via the freecad MCP execute_code)</text>

  <!-- ============ Relationships ============ -->
  <!-- build (boundary) -> STL artifact -->
  <line x1="365" y1="192" x2="430" y2="192" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="440,192 430,187 430,197" fill="#64748B"/>
  <text x="402" y="180" font-size="11" fill="#334155" text-anchor="middle">3x STL</text>

  <!-- STL artifact -> make_arm_urdf -->
  <line x1="695" y1="192" x2="795" y2="192" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="805,192 795,187 795,197" fill="#64748B"/>
  <text x="750" y="180" font-size="11" fill="#334155" text-anchor="middle">trimesh.load</text>

  <!-- make_arm_urdf -> URDF artifact -->
  <line x1="932" y1="245" x2="932" y2="320" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="932,330 927,320 937,320" fill="#64748B"/>
  <text x="942" y="285" font-size="11" fill="#334155">writes two_link_arm.urdf + OBJ</text>

  <!-- URDF artifact -> verify (diagonal) -->
  <line x1="860" y1="440" x2="647" y2="521" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="638,525 645,516 649,525" fill="#64748B"/>
  <text x="722" y="470" font-size="11" fill="#334155" text-anchor="middle">p.loadURDF</text>

  <!-- URDF artifact -> IK example -->
  <line x1="932" y1="435" x2="932" y2="520" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="932,530 927,520 937,520" fill="#64748B"/>
  <text x="942" y="480" font-size="11" fill="#334155">p.loadURDF</text>

  <!-- verify -> PyBullet -->
  <line x1="470" y1="582" x2="405" y2="582" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="395,582 405,577 405,587" fill="#64748B"/>
  <text x="437" y="570" font-size="11" fill="#334155" text-anchor="middle">physics</text>

  <!-- verify closes the loop: back to the part script -->
  <line x1="597" y1="635" x2="597" y2="690" stroke="#64748B" stroke-width="1.5"/>
  <line x1="597" y1="690" x2="90" y2="690" stroke="#64748B" stroke-width="1.5"/>
  <line x1="90" y1="690" x2="90" y2="340" stroke="#64748B" stroke-width="1.5"/>
  <polygon points="90,330 85,340 95,340" fill="#64748B"/>
  <text x="345" y="707" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">verify closes the loop — on FAIL, edit the part script and re-run the 3 steps</text>

  <!-- ============ Pipeline scripts ============ -->
  <!-- build_two_link_arm.py -->
  <g>
    <rect x="75" y="140" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="202" y="164" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">build_two_link_arm.py</text>
    <text x="202" y="183" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python · FreeCAD Part API]</text>
    <text x="202" y="202" font-size="12" fill="#F8FAFC" text-anchor="middle">three Part boxes; each link is</text>
    <text x="202" y="217" font-size="12" fill="#F8FAFC" text-anchor="middle">modeled in its own joint frame;</text>
    <text x="202" y="232" font-size="12" fill="#F8FAFC" text-anchor="middle">exports per-link STL + .FCStd</text>
  </g>

  <!-- STL + FCStd artifact -->
  <g>
    <rect x="440" y="140" width="255" height="105" rx="6" fill="#DBEAFE"/>
    <text x="567" y="164" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">STL meshes + .FCStd</text>
    <text x="567" y="183" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[ASCII STL · millimeters]</text>
    <text x="567" y="202" font-size="12" fill="#0F172A" text-anchor="middle">base_link, link1, link2 (STL is</text>
    <text x="567" y="217" font-size="12" fill="#0F172A" text-anchor="middle">intermediate, gitignored); .FCStd</text>
    <text x="567" y="232" font-size="12" fill="#0F172A" text-anchor="middle">tracked in assets/cad/ for editing</text>
  </g>

  <!-- make_arm_urdf.py -->
  <g>
    <rect x="805" y="140" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="932" y="164" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">make_arm_urdf.py</text>
    <text x="932" y="183" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python · trimesh · project venv]</text>
    <text x="932" y="202" font-size="12" fill="#F8FAFC" text-anchor="middle">scales mm→m, re-exports OBJ</text>
    <text x="932" y="217" font-size="12" fill="#F8FAFC" text-anchor="middle">(PyBullet-safe), computes mass</text>
    <text x="932" y="232" font-size="12" fill="#F8FAFC" text-anchor="middle">+ inertia at 700 kg/m³</text>
  </g>

  <!-- URDF artifact -->
  <g>
    <rect x="805" y="330" width="255" height="105" rx="6" fill="#DBEAFE"/>
    <text x="932" y="354" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">assets/urdf/two_link_arm/</text>
    <text x="932" y="373" font-size="11" font-style="italic" fill="#0F172A" text-anchor="middle">[URDF + OBJ meshes · meters]</text>
    <text x="932" y="392" font-size="12" fill="#0F172A" text-anchor="middle">3 links · 2 revolute joints</text>
    <text x="932" y="407" font-size="12" fill="#0F172A" text-anchor="middle">shoulder z=0.02 · elbow z=0.15</text>
    <text x="932" y="422" font-size="12" fill="#0F172A" text-anchor="middle">axis Y · ±1.57 rad · 0.126 kg</text>
  </g>

  <!-- verify_arm_pybullet.py -->
  <g>
    <rect x="470" y="530" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="597" y="554" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">verify_arm_pybullet.py</text>
    <text x="597" y="573" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[Python · PyBullet DIRECT]</text>
    <text x="597" y="592" font-size="12" fill="#F8FAFC" text-anchor="middle">loads URDF headless, drives both</text>
    <text x="597" y="607" font-size="12" fill="#F8FAFC" text-anchor="middle">joints; PASS = 2 revolute joints</text>
    <text x="597" y="622" font-size="12" fill="#F8FAFC" text-anchor="middle">found and tip moves &gt; 20 mm</text>
  </g>

  <!-- examples/pybullet IK consumer -->
  <g>
    <rect x="805" y="530" width="255" height="105" rx="6" fill="#0F6CBD"/>
    <text x="932" y="554" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">arm_ik_control.py</text>
    <text x="932" y="573" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[examples/pybullet · analytic IK]</text>
    <text x="932" y="592" font-size="12" fill="#F8FAFC" text-anchor="middle">2-link planar IK on the same</text>
    <text x="932" y="607" font-size="12" fill="#F8FAFC" text-anchor="middle">URDF; commands joints, checks</text>
    <text x="932" y="622" font-size="12" fill="#F8FAFC" text-anchor="middle">tip reaches targets (mm error)</text>
  </g>

  <!-- External: PyBullet -->
  <g>
    <rect x="140" y="530" width="255" height="105" rx="6" fill="#64748B"/>
    <text x="267" y="554" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">PyBullet</text>
    <text x="267" y="573" font-size="11" font-style="italic" fill="#F8FAFC" text-anchor="middle">[physics engine · pip]</text>
    <text x="267" y="592" font-size="12" fill="#F8FAFC" text-anchor="middle">DIRECT (headless) or --gui;</text>
    <text x="267" y="607" font-size="12" fill="#F8FAFC" text-anchor="middle">loads OBJ via tinyobjloader —</text>
    <text x="267" y="622" font-size="12" fill="#F8FAFC" text-anchor="middle">FreeCAD ASCII STL won't load</text>
  </g>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="722" x2="210" y2="722" stroke="#CBD5E1" stroke-width="1"/>
  <text x="24" y="748" font-size="12" font-weight="bold" fill="#0F172A">Legend</text>
  <g>
    <rect x="24" y="762" width="18" height="18" rx="3" fill="#0F6CBD"/>
    <text x="50" y="776" font-size="12" fill="#334155">Pipeline script (code in repo)</text>

    <rect x="280" y="762" width="18" height="18" rx="3" fill="#DBEAFE"/>
    <text x="306" y="776" font-size="12" fill="#334155">Generated artifact</text>

    <rect x="480" y="762" width="18" height="18" rx="3" fill="#64748B"/>
    <text x="506" y="776" font-size="12" fill="#334155">External library</text>

    <rect x="650" y="762" width="26" height="18" rx="3" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="684" y="776" font-size="12" fill="#334155">Execution boundary (freecadcmd)</text>

    <line x1="920" y1="771" x2="960" y2="771" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="970,771 960,766 960,776" fill="#64748B"/>
    <text x="980" y="776" font-size="12" fill="#334155">Data flow [label]</text>
  </g>
  <text x="24" y="812" font-size="11" fill="#475569">C4 model (component view) · generated from repository sources: cad/build_two_link_arm.py, cad/make_arm_urdf.py, cad/verify_arm_pybullet.py, examples/pybullet/arm_ik_control.py</text>
  <rect x="0" y="0" width="100%" height="6" fill="#38BDF8"/>
</svg>
