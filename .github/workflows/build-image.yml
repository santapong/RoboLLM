name: build-image

# Build and publish the ROS2-arm workbench image to GHCR.
# The four docker/Dockerfile copies are byte-identical (files-identical law),
# so building any one copy is equivalent; we build the hand_follow copy.
on:
  push:
    branches: [develop]
    paths:
      - '**/docker/Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/santapong/robollm/ros2-arm:jazzy
  # Dedicated cache tag alongside the image in the same GHCR repo.
  CACHE: ghcr.io/santapong/robollm/ros2-arm:buildcache

jobs:
  build:
    runs-on: ubuntu-latest
    # Bound the first, uncached build: a ~4.4GB image plus mode=max registry
    # cache export on a GitHub-hosted runner (~14GB disk) can wedge or fill the
    # disk; without a cap a stuck build burns the 360-min default. 90 min is
    # ample for a cold build and fails fast on a wedge.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push image + cache to GHCR via GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Any copy works (all four are byte-identical); build the hand_follow one.
          context: examples/hand_follow/docker
          file: examples/hand_follow/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          # Registry cache, NOT type=gha. The image is ~4.4GB; with mode=max the
          # cache manifest (base + all intermediate layers) is larger still. The
          # GitHub Actions cache is capped at 10GB per repo with LRU eviction, so
          # a single build this size would evict itself and thrash cache misses.
          # Registry cache lives in the same GHCR repo with no such cap and
          # persists across branches, giving reliable layer reuse for slow apt /
          # pip / model-download layers.
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max
