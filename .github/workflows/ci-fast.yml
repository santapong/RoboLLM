name: ci-fast

# Native (no-ROS) fast gate: pure-python tests + errors-only lint.
# Blocking, target < 3 min. Heavier ROS 2 / container work lives elsewhere.

on:
  push:
    branches: [develop, main]   # PR branches are covered by pull_request —
  pull_request:                 # no double-run per commit

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps (ROS-compatible NumPy + pinned MuJoCo)
        run: |
          python -m pip install --upgrade pip
          # The B1 CPU contracts exercise the real MuJoCo model. Keep this on
          # the ROS-compatible NumPy ABI line; LeRobot stays in its own env.
          pip install -c requirements/ros-constraints.txt \
            numpy==1.26.4 mujoco==3.10.0 opencv-python-headless==4.10.0.84 \
            pytest hypothesis ruff pyserial pyyaml

      - name: Ruff (errors only — E9, F)
        run: >-
          ruff check --select E9,F
          src/ apps/ hardware/ ros2/robo_arm_driver/robo_arm_driver/
          examples/mujoco/ scripts/ tests/unit/

      - name: Firmware config is synchronized
        run: python hardware/generate_firmware_config.py --check

      - name: Pytest (native fast suite)
        run: pytest tests/unit/ -q
