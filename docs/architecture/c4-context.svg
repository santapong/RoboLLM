<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="840" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#000000">System Context — robot-llm-loop workbench</text>
  <text x="30" y="62" font-size="12" fill="#555555">C4 Level 1 · System Context</text>

  <!-- ===================== Relationships (drawn under boxes) ===================== -->
  <!-- You <-> Claude : natural language -->
  <line x1="382" y1="140" x2="868" y2="140" stroke="#707070" stroke-width="1.5"/>
  <polygon points="880,140 868,135 868,145" fill="#707070"/>
  <polygon points="370,140 382,135 382,145" fill="#707070"/>
  <text x="625" y="128" font-size="12" fill="#555555" text-anchor="middle">natural language</text>

  <!-- You -> workbench : browser dashboard -->
  <line x1="310" y1="200" x2="560" y2="370" stroke="#707070" stroke-width="1.5"/>
  <polygon points="560,370 547.3,367.4 552.9,359.1" fill="#707070"/>
  <text x="405" y="270" font-size="12" fill="#555555" text-anchor="end">browser dashboard</text>

  <!-- Claude -> workbench : MCP tools -->
  <line x1="980" y1="220" x2="760" y2="370" stroke="#707070" stroke-width="1.5"/>
  <polygon points="760,370 767.1,359.1 772.7,367.4" fill="#707070"/>
  <text x="890" y="290" font-size="12" fill="#555555">MCP tools (stdio)</text>

  <!-- You -> Webcam : hand gestures -->
  <line x1="205" y1="200" x2="205" y2="400" stroke="#707070" stroke-width="1.5"/>
  <polygon points="205,400 200,388 210,388" fill="#707070"/>
  <text x="215" y="300" font-size="12" fill="#555555">hand gestures</text>

  <!-- Webcam -> workbench : frames -->
  <line x1="320" y1="455" x2="470" y2="455" stroke="#707070" stroke-width="1.5"/>
  <polygon points="470,455 458,450 458,460" fill="#707070"/>
  <text x="395" y="443" font-size="12" fill="#555555" text-anchor="middle">frames</text>

  <!-- workbench -> sim : ROS 2 topics/actions -->
  <line x1="570" y1="530" x2="490" y2="640" stroke="#707070" stroke-width="1.5"/>
  <polygon points="490,640 493.1,627.4 501.1,633.2" fill="#707070"/>
  <text x="520" y="580" font-size="12" fill="#555555" text-anchor="end">ROS 2 topics / actions</text>

  <!-- workbench -> real arm : serial 115200 -->
  <line x1="710" y1="530" x2="840" y2="640" stroke="#707070" stroke-width="1.5"/>
  <polygon points="840,640 827.6,636.1 834,628.4" fill="#707070"/>
  <text x="790" y="580" font-size="12" fill="#555555">serial 115200 baud</text>

  <!-- ===================== Person: You (operator) ===================== -->
  <g>
    <circle cx="260" cy="76" r="18" fill="#08427B"/>
    <rect x="150" y="88" width="220" height="112" rx="6" fill="#08427B"/>
    <text x="260" y="118" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You (operator)</text>
    <text x="260" y="136" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Person]</text>
    <text x="260" y="156" font-size="12" fill="#FFFFFF" text-anchor="middle">Roboticist driving sims and
      <tspan x="260" dy="16">a real arm from a browser</tspan>
      <tspan x="260" dy="16">and chat</tspan>
    </text>
  </g>

  <!-- ===================== External: Claude (LLM) ===================== -->
  <g>
    <rect x="880" y="80" width="280" height="140" rx="6" fill="#999999"/>
    <text x="1020" y="108" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Claude (LLM)</text>
    <text x="1020" y="126" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[External · any MCP client]</text>
    <text x="1020" y="148" font-size="12" fill="#FFFFFF" text-anchor="middle">LLM agent driving robots via
      <tspan x="1020" dy="16">MCP tools over stdio. Can be</tspan>
      <tspan x="1020" dy="16">any MCP client (Claude</tspan>
      <tspan x="1020" dy="16">Desktop, IDEs, agents).</tspan>
    </text>
  </g>

  <!-- ===================== System: robot-llm-loop workbench ===================== -->
  <g>
    <rect x="470" y="370" width="340" height="160" rx="6" fill="#1168BD"/>
    <text x="640" y="398" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">robot-llm-loop workbench</text>
    <text x="640" y="418" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Python · rclpy · FastAPI · FastMCP]</text>
    <text x="640" y="442" font-size="12" fill="#FFFFFF" text-anchor="middle">One shared rclpy bridge node
      <tspan x="640" dy="16">powering 22 MCP tools and a web</tspan>
      <tspan x="640" dy="16">dashboard (:8080) to sense and</tspan>
      <tspan x="640" dy="16">command sim + real robots.</tspan>
    </text>
  </g>

  <!-- ===================== External: Webcam ===================== -->
  <g>
    <rect x="90" y="400" width="230" height="110" rx="6" fill="#999999"/>
    <text x="205" y="428" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Webcam</text>
    <text x="205" y="446" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[/dev/video0]</text>
    <text x="205" y="468" font-size="12" fill="#FFFFFF" text-anchor="middle">Captures the operator's
      <tspan x="205" dy="16">hand for gesture teleop</tspan>
    </text>
  </g>

  <!-- ===================== External: ROS 2 + Gazebo sim ===================== -->
  <g>
    <rect x="330" y="640" width="280" height="130" rx="6" fill="#999999"/>
    <text x="470" y="668" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ROS 2 Jazzy + Gazebo</text>
    <text x="470" y="686" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Software System]</text>
    <text x="470" y="708" font-size="12" fill="#FFFFFF" text-anchor="middle">Simulated robots: TurtleBot3,
      <tspan x="470" dy="16">arms · SLAM · Nav2 · MoveIt</tspan>
    </text>
  </g>

  <!-- ===================== External: Real DIY arm ===================== -->
  <g>
    <rect x="720" y="640" width="300" height="130" rx="6" fill="#999999"/>
    <text x="870" y="668" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Real DIY arm</text>
    <text x="870" y="686" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="middle">[Hardware · Pi 5 + Arduino Uno R3]</text>
    <text x="870" y="708" font-size="12" fill="#FFFFFF" text-anchor="middle">3D-printed servo arm driven
      <tspan x="870" dy="16">over USB serial</tspan>
    </text>
  </g>

  <!-- ===================== Legend ===================== -->
  <line x1="30" y1="770" x2="1250" y2="770" stroke="#DDDDDD" stroke-width="1"/>
  <g>
    <rect x="30" y="790" width="30" height="18" rx="3" fill="#08427B"/>
    <text x="68" y="804" font-size="12" fill="#000000">Person</text>
    <rect x="150" y="790" width="30" height="18" rx="3" fill="#1168BD"/>
    <text x="188" y="804" font-size="12" fill="#000000">System in focus</text>
    <rect x="330" y="790" width="30" height="18" rx="3" fill="#999999"/>
    <text x="368" y="804" font-size="12" fill="#000000">External system / device</text>
    <line x1="560" y1="799" x2="606" y2="799" stroke="#707070" stroke-width="1.5"/>
    <polygon points="618,799 606,794 606,804" fill="#707070"/>
    <text x="626" y="804" font-size="12" fill="#000000">Relationship</text>
    <text x="1250" y="804" font-size="12" fill="#999999" text-anchor="end">C4 Model — Level 1 (System Context)</text>
  </g>
</svg>
