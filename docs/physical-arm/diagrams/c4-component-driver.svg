<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">RoboLLM · Arm-driver C4 component diagram</title>
  <desc id="desc">Components inside robo_arm_driver and their relationship to ROS 2, canonical YAML configuration, the protocol simulator, and real Mega firmware.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <style>.title{font-size:25px;font-weight:700;fill:#0F172A}.sub{font-size:13px;fill:#475569}.boundary{fill:#EFF6FF;stroke:#0F6CBD;stroke-width:2;stroke-dasharray:8 5}.component{fill:#0F6CBD;stroke:#0F2742;stroke-width:2}.external{fill:#64748B;stroke:#334155;stroke-width:2}.name{font-size:15px;font-weight:700;fill:#F8FAFC}.type{font-size:11px;font-style:italic;fill:#DBEAFE}.body{font-size:11px;fill:#F8FAFC}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font-size:11px;fill:#334155}.guard{fill:#FFF7ED;stroke:#C2410C;stroke-width:2}.guardText{font-size:13px;font-weight:700;fill:#9A3412}</style>
  </defs>
  <rect width="1440" height="800" fill="#F8FAFC"/>
  <text x="35" y="44" class="title">RoboLLM · Arm-driver components</text>
  <text x="35" y="67" class="sub">All blue components exist locally and are covered by native or pseudo-terminal tests.</text>

  <rect x="30" y="165" width="190" height="115" rx="9" class="external"/>
  <text x="125" y="197" text-anchor="middle" class="name">ROS 2 graph</text><text x="125" y="218" text-anchor="middle" class="type">[External container]</text>
  <text x="125" y="246" text-anchor="middle" class="body">trajectory action / topic</text><text x="125" y="263" text-anchor="middle" class="body">feedback · state · status</text>

  <rect x="260" y="100" width="850" height="570" rx="14" class="boundary"/>
  <text x="280" y="130" class="sub">robo_arm_driver package</text>

  <rect x="305" y="175" width="210" height="105" rx="8" class="component"/>
  <text x="410" y="205" text-anchor="middle" class="name">ROS node adapter</text><text x="410" y="225" text-anchor="middle" class="type">node.py</text>
  <text x="410" y="251" text-anchor="middle" class="body">action · topics · timer</text>

  <rect x="575" y="175" width="210" height="105" rx="8" class="component"/>
  <text x="680" y="205" text-anchor="middle" class="name">Trajectory validator</text><text x="680" y="225" text-anchor="middle" class="type">safety.py</text>
  <text x="680" y="251" text-anchor="middle" class="body">names · bounds · time · speed</text>

  <rect x="845" y="175" width="210" height="105" rx="8" class="component"/>
  <text x="950" y="205" text-anchor="middle" class="name">Trajectory sampler</text><text x="950" y="225" text-anchor="middle" class="type">safety.py</text>
  <text x="950" y="251" text-anchor="middle" class="body">linear control-rate targets</text>

  <rect x="305" y="365" width="210" height="105" rx="8" class="component"/>
  <text x="410" y="395" text-anchor="middle" class="name">Config loader</text><text x="410" y="415" text-anchor="middle" class="type">config.py</text>
  <text x="410" y="441" text-anchor="middle" class="body">schema + calibration mapping</text>

  <rect x="575" y="365" width="210" height="105" rx="8" class="component"/>
  <text x="680" y="395" text-anchor="middle" class="name">Serial boundary</text><text x="680" y="415" text-anchor="middle" class="type">arm_serial.py</text>
  <text x="680" y="441" text-anchor="middle" class="body">radians ↔ raw degrees</text>

  <rect x="845" y="365" width="210" height="105" rx="8" class="component"/>
  <text x="950" y="395" text-anchor="middle" class="name">State/status publisher</text><text x="950" y="415" text-anchor="middle" class="type">node.py</text>
  <text x="950" y="441" text-anchor="middle" class="body">provenance + last error</text>

  <rect x="450" y="545" width="470" height="70" rx="8" class="guard"/>
  <text x="685" y="573" text-anchor="middle" class="guardText">Fail closed: uncalibrated, invalid, stale, or I/O-failed actions do not execute</text>
  <text x="685" y="595" text-anchor="middle" class="label">Errors cancel sampling; I/O failures request torque-off.</text>

  <rect x="30" y="500" width="190" height="105" rx="9" class="external"/>
  <text x="125" y="531" text-anchor="middle" class="name">joints.yaml</text><text x="125" y="551" text-anchor="middle" class="type">[Canonical configuration]</text>
  <text x="125" y="578" text-anchor="middle" class="body">limits · home · sign · rates</text>
  <rect x="1180" y="325" width="220" height="105" rx="9" class="external"/>
  <text x="1290" y="356" text-anchor="middle" class="name">sim_uno.py</text><text x="1290" y="376" text-anchor="middle" class="type">[Test adapter]</text>
  <text x="1290" y="403" text-anchor="middle" class="body">pty protocol + dynamics</text>
  <rect x="1180" y="520" width="220" height="105" rx="9" class="external"/>
  <text x="1290" y="551" text-anchor="middle" class="name">arm-fw 2.1</text><text x="1290" y="571" text-anchor="middle" class="type">[Arduino firmware]</text>
  <text x="1290" y="598" text-anchor="middle" class="body">hard limits + watchdog</text>

  <line x1="220" y1="220" x2="295" y2="220" stroke="#475569" stroke-width="2.5"/><line x1="305" y1="250" x2="230" y2="250" stroke="#475569" stroke-width="2.5"/>
  <line x1="515" y1="225" x2="565" y2="225" stroke="#475569" stroke-width="2.5"/><line x1="785" y1="225" x2="835" y2="225" stroke="#475569" stroke-width="2.5"/>
  <line x1="950" y1="280" x2="740" y2="355" stroke="#475569" stroke-width="2.5"/><text x="830" y="315" class="label">sampled radians</text>
  <line x1="515" y1="417" x2="565" y2="417" stroke="#475569" stroke-width="2.5"/><text x="525" y="405" class="label">mapping</text>
  <line x1="785" y1="417" x2="835" y2="417" stroke="#475569" stroke-width="2.5"/><text x="798" y="405" class="label">state</text>
  <line x1="220" y1="552" x2="305" y2="430" stroke="#475569" stroke-width="2.5"/><text x="225" y="500" class="label">validated config</text>
  <line x1="785" y1="390" x2="815" y2="320" stroke="#475569" stroke-width="2.5"/><line x1="815" y1="320" x2="1120" y2="320" stroke="#475569" stroke-width="2.5"/><line x1="1120" y1="320" x2="1120" y2="377" stroke="#475569" stroke-width="2.5"/><line x1="1120" y1="377" x2="1170" y2="377" stroke="#475569" stroke-width="2.5"/><line x1="785" y1="440" x2="820" y2="500" stroke="#475569" stroke-width="2.5"/><line x1="820" y1="500" x2="1120" y2="500" stroke="#475569" stroke-width="2.5"/><line x1="1120" y1="500" x2="1120" y2="570" stroke="#475569" stroke-width="2.5"/><line x1="1120" y1="570" x2="1170" y2="570" stroke="#475569" stroke-width="2.5"/><text x="900" y="520" class="label">same arm-fw 2.1 protocol</text>
  <rect x="0" y="0" width="100%" height="6" fill="#38BDF8"/>
</svg>
